<title id="title">Man riding a bicycle in the rain</title><desc id="desc">An adult man in a mustard jacket leans forward on a bicycle. Both hands grip the handlebars, his hips rest on the saddle, and both feet are on the pedals. Rain falls over a city street.</desc>
