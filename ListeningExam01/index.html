, "text": "你今天早上的會議為什麼遲到了？"}], "translationZhTW": "男：你今天早上的會議為什麼遲到了？", "options": [{"id": "A", "text": "The meeting room is on the second floor.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "Because my bus broke down on the road.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "We will meet again tomorrow.", "imagePath": null, "imageAlt": null}], "correctOptionId": "B", "explanationZhTW": "問句詢問早上會議遲到的原因，(B)「因為我搭的公車在路上拋錨了。」直接說明理由；(A) 說會議室樓層，(C) 說明天再開會。", "skillTags": ["基本問答・詢問遲到原因"], "points": 1, "audioDurationSeconds": 4.2}, {"id": "gept-listening-01-q09", "number": 9, "sectionId": "response", "type": "single-choice", "instruction": "請聽語音，選出最適合的回應。", "audioPath": "audio/q09.m4a", "transcript": [{"speaker": "F", "text": "Would you like some vegetable soup or a cup of hot tea?"}], "transcriptZhTW": [{"speaker": "F", "text": "你想要來點蔬菜湯還是一杯熱茶？"}], "translationZhTW": "女：你想要來點蔬菜湯還是一杯熱茶？", "options": [{"id": "A", "text": "The soup is thirty dollars.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "I have breakfast at seven.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "Hot tea would be great, thank you.", "imagePath": null, "imageAlt": null}], "correctOptionId": "C", "explanationZhTW": "問句詢問想喝蔬菜湯還是熱茶，(C)「熱茶就太好了，謝謝你。」是禮貌明確的選擇；(A) 說湯的價錢，(B) 說七點吃早餐。", "skillTags": ["基本問答・詢問餐點喜好"], "points": 1, "audioDurationSeconds": 5.0}, {"id": "gept-listening-01-q10", "number": 10, "sectionId": "response", "type": "single-choice", "instruction": "請聽語音，選出最適合的回應。", "audioPath": "audio/q10.m4a", "transcript": [{"speaker": "M", "text": "What are your plans for this coming weekend?"}], "transcriptZhTW": [{"speaker": "M", "text": "你這週末有什麼計畫嗎？"}], "translationZhTW": "男：你這週末有什麼計畫嗎？", "options": [{"id": "A", "text": "I am going to visit my grandmother in the countryside.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "Last weekend was very fun.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "The weather was cold and rain 的，我想買三本筆記本和一枝鉛筆。\n女：每本筆記本二十元，鉛筆十元。\n男：這是一百元。\n女：謝謝你，找你三十元。\n旁白：問題：男孩買筆記本和鉛筆總共花了多少錢？", "options": [{"id": "A", "text": "Thirty dollars.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "Sixty dollars.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "Seventy dollars.", "imagePath": null, "imageAlt": null}], "correctOptionId": "C", "explanationZhTW": "三本筆記本 60 元加上一枝鉛筆 10 元，總共花費 70 元（付 100 元找 30 元），故選 (C)。", "skillTags": ["言談理解・書店文具購買金額"], "points": 1, "audioDurationSeconds": 31.7}, {"id": "gept-listening-01-q13", "number": 13, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q13.m4a", "transcript": [{"speaker": "M", "text": "Are you ready to play badminton this afternoon?"}, {"speaker": "F", "text": "Yes. What time shall we meet at the sports center?"}, {"speaker": "M", "text": "Our game starts at four thirty, so let us meet twenty minutes earlier."}, {"speaker": "F", "text": "Okay, I will see you at the gate."}, {"speaker": "N", "text": "Question: What time will the man and the woman meet?"}], "transcriptZhTW": [{"speaker": "M", "text": "你今天下午準備好去打羽球了嗎？"}, {"speaker": "F", "text": "好了。我們幾點在運動中心集合？"}, {"speaker": "M", "text": "比賽四點半開始，所以我們提早二十分鐘碰面吧。"}, {"speaker": "F", "text": "好的，門口見。"}, {"speaker": "N", "text": "問題：男子與女子幾點會集合？"}], "translationZhTW": "男：你今天下午準備好去打羽球了嗎？\n女：好了。我們幾點在運動中心集合？\n男：比賽四點半開始，所以我們提早二十分鐘碰面吧。\n女：好的，門口見。\n旁白：問題：男子與女子幾點會集合？", "options": [{"id": "A", "text": "At four ten.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "At four twenty.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "At four thirty.", "imagePath": null, "imageAlt": null}], "correctOptionId": "A", "explanationZhTW": "比賽四點半開始，提早二十分鐘集合，即四點十分（4:10），故選 (A)。", "skillTags": ["言談理解・羽球運動集合時間"], "points": 1, "audioDurationSeconds": 25.0}, {"id": "gept-listening-01-q14", "number": 14, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q14.m4a", "transcript": [{"speaker": "F", "text": "Excuse me, how many books can a student borrow at one time?"}, {"speaker": "M", "text": "Each student can borrow up to five novels for three weeks."}, {"speaker": "F", "text": "Can I take this dictionary home?"}, {"speaker": "M", "text": "Sorry, dictionaries and magazines must stay in the library."}, {"speaker": "N", "text": "Question: What can students borrow and take home?"}], "transcriptZhTW": [{"speaker": "F", "text": "不好意思，學生一次可以借幾本書？"}, {"speaker": "M", "text": "每位學生最多可以借五本小說，借期三週。"}, {"speaker": "F", "text": "我可以把這本字典借回家嗎？"}, {"speaker": "M", "text": "抱歉，字典和雜誌必須留在館內。"}, {"speaker": "N", "text": "問題：學生可以借哪種書帶回家？"}], "translationZhTW": "女：不好意思，學生一次可以借幾本書？\n男：每位學生最多可以借五本小說，借期三週。\n女：我可以把這本字典借回家嗎？\n男：抱歉，字典和雜誌必須留在館內。\n旁白：問題：學生可以借哪種書帶回家？", "options": [{"id": "A", "text": "Dictionaries.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "Novels.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "Magazines.", "imagePath": null, "imageAlt": null}], "correctOptionId": "B", "explanationZhTW": "對話中館員說明字典與雜誌只能在館內閱讀，小說可以借出帶回家，故選 (B)。", "skillTags": ["言談理解・圖書館借書規則"], "points": 1, "audioDurationSeconds": 25.0}, {"id": "gept-listening-01-q15", "number": 15, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q15.m4a", "transcript": [{"speaker": "M", "text": "The morning train to Tainan leaves at nine forty."}, {"speaker": "F", "text": "It takes fifteen minutes to walk to the train station from our hotel."}, {"speaker": "M", "text": "Then let us leave our hotel at nine o'clock."}, {"speaker": "F", "text": "Good idea. We will have enough time to buy tickets."}, {"speaker": "N", "text": "Question: What time will they leave the hotel?"}], "transcriptZhTW": [{"speaker": "M", "text": "前往台南的早班火車九點四十分開車。"}, {"speaker": "F", "text": "從我們飯店走到火車站需要十五分鐘。"}, {"speaker": "M", "text": "那我們九點就從飯店出發吧。"}, {"speaker": "F", "text": "好主意，這樣我們有充足時間買票。"}, {"speaker": "N", "text": "問題：他們幾點會離開飯店？"}], "translationZhTW": "男：前往台南的早班火車九點四十分開車。\n女：從我們飯店走到火車站需要十五分鐘。\n男：那我們九點就從飯店出發吧。\n女：好主意，這樣我們有充足時間買票。\n旁白：問題：他們幾點會離開飯店？", "options": [{"id": "A", "text": "At nine o'clock.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "At nine fifteen.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "At nine forty.", "imagePath": null, "imageAlt": null}], "correctOptionId": "A", "explanationZhTW": "男子提議九點離開飯店，女子表示贊同，故選 (A)。", "skillTags": ["言談理解・前往車站出發時間"], "points": 1, "audioDurationSeconds": 25.2}, {"id": "gept-listening-01-q16", "number": 16, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q16.m4a", "transcript": [{"speaker": "F", "text": "Welcome to Sun Cafe. Are you ready to order?"}, {"speaker": "M", "text": "Yes. I would like a chicken sandwich and a glass of apple juice."}, {"speaker": "F", "text": "If you order a fruit salad, the apple juice is free today."}, {"speaker": "M", "text": "That sounds delicious. Please add the salad for me."}, {"speaker": "N", "text": "Question: What drink will the man get for free?"}], "transcriptZhTW": [{"speaker": "F", "text": "歡迎光臨太陽咖啡廳，準備好點餐了嗎？"}, {"speaker": "M", "text": "是的，我想要一份雞肉三明治和一杯蘋果汁。"}, {"speaker": "F", "text": "如果您點水果沙拉，今天蘋果汁免費贈送。"}, {"speaker": "M", "text": "聽起來很美味，請幫我加上沙拉。"}, {"speaker": "N", "text": "問題：男子點沙拉可以免費獲得什麼飲料？"}], "translationZhTW": "女：歡迎光臨太陽咖啡廳，準備好點餐了嗎？\n男：是的，我想要一份雞肉三明治和一杯蘋果汁。\n女：如果您點水果沙拉，今天蘋果汁免費贈送。\n男：聽起來很美味，請幫我加上沙拉。\n旁白：問題：男子點沙拉可以免費獲得什麼飲料？", "options": [{"id": "A", "text": "Vegetable soup.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "Apple juice.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "Hot tea.", "imagePath": null, "imageAlt": null}], "correctOptionId": "B", "explanationZhTW": "服務生說明若點水果沙拉，蘋果汁今天免費贈送，男子接受了建議，故選 (B)。", "skillTags": ["言談理解・咖啡廳沙拉贈飲優惠"], "points": 1, "audioDurationSeconds": 28.0}, {"id": "gept-listening-01-q17", "number": 17, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q17.m4a", "transcript": [{"speaker": "M", "text": "Good afternoon, doctor. My stomach hurts after lunch."}, {"speaker": "F", "text": "Did you eat anything cold or sweet?"}, {"speaker": "M", "text": "I ate some ice cream and drank two cold sodas."}, {"speaker": "F", "text": "Take this medicine three times a day, and drink more warm water."}, {"speaker": "N", "text": "Question: What does the doctor tell the man to do?"}], "transcriptZhTW": [{"speaker": "M", "text": "午安，醫生。我午餐後肚子痛。"}, {"speaker": "F", "text": "你吃了生冷或甜的食物嗎？"}, {"speaker": "M", "text": "我吃了一些冰淇淋，還喝了兩罐冷汽水。"}, {"speaker": "F", "text": "這包藥一天吃三次，並且多喝溫開水。"}, {"speaker": "N", "text": "問題：醫生交代男子做什麼？"}], "translationZhTW": "男：午安，醫生。我午餐後肚子痛。\n女：你吃了生冷或甜的食物嗎？\n男：我吃了一些冰淇淋，還喝了兩罐冷汽水。\n女：這包藥一天吃三次，並且多喝溫開水。\n旁白：問題：醫生交代男子做什麼？", "options": [{"id": "A", "text": "Eat more ice cream.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "Drink cold soda.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "Drink warm water.", "imagePath": null, "imageAlt": null}], "correctOptionId": "C", "explanationZhTW": "醫生囑咐男子一天吃三次藥，並多喝溫水，故選 (C)。", "skillTags": ["言談理解・診所就診醫囑"], "points": 1, "audioDurationSeconds": 25.2}, {"id": "gept-listening-01-q18", "number": 18, "sectionId": "dialogue", "type": "image-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q18.m4a", "transcript": [{"speaker": "F", "text": "Let us look at the town map. The big park is in the center."}, {"speaker": "M", "text": "Where is the post office? I need to mail a letter."}, {"speaker": "F", "text": "The post office is south of the park, next to the flower shop."}, {"speaker": "M", "text": "Great, I will walk there right away."}, {"speaker": "N", "text": "Question: Where is the boy going?"}], "transcriptZhTW": [{"speaker": "F", "text": "我們看一下小鎮地圖吧。大公園在正中央。"}, {"speaker": "M", "text": "郵局在哪裡？我需要寄一封信。"}, {"speaker": "F", "text": "郵局在公園南邊，緊鄰花店。"}, {"speaker": "M", "text": "太好了，我馬上走過去。"}, {"speaker": "N", "text": "問題：男孩要去哪裡？"}], "translationZhTW": "女：我們看一下小鎮地圖吧。大公園在正中央。\n男：郵局在哪裡？我需要寄一封信。\n女：郵局在公園南邊，緊鄰花店。\n男：太好了，我馬上走過去。\n旁白：問題：男孩要去哪裡？", "options": [{"id": "A", "text": null, "imagePath": "images/town-map-bank.svg", "imageAlt": "Town map highlighting the Bank"}, {"id": "B", "text": null, "imagePath": "images/town-map-post-office.svg", "imageAlt": "Town map highlighting the Post Office"}, {"id": "C", "text": null, "imagePath": "images/town-map-hospital.svg", "imageAlt": "Town map highlighting the Hospital"}], "correctOptionId": "B", "explanationZhTW": "男孩要寄信前往郵局，地圖顯示郵局在公園南邊，故選 (B)。", "skillTags": ["言談理解・小鎮地圖與尋找郵局"], "points": 1, "audioDurationSeconds": 25.5}, {"id": "gept-listening-01-q19", "number": 19, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q19.m4a", "transcript": [{"speaker": "M", "text": "Attention, all teachers and students. Because of the heavy rain this morning, the school sports day will not take place on Friday. We will move all races and ball games to next Tuesday. Classes will go on as usual this Friday. Thank you."}, {"speaker": "N", "text": "Question: On what day will the sports day take place?"}], "transcriptZhTW": [{"speaker": "M", "text": "各位老師與同學請注意。因為今天早上下大雨，學校運動會將不會在星期五舉行。我們將所有跑步競賽與球類比賽移至下週二。這週五則照常上課，謝謝。"}, {"speaker": "N", "text": "問題：運動會將在星期幾舉行？"}], "translationZhTW": "男：各位老師與同學請注意。因為今天早上下大雨，學校運動會將不會在星期五舉行。我們將所有跑步競賽與球類比賽移至下週二。這週五則照常上課，謝謝。\n旁白：問題：運動會將在星期幾舉行？", "options": [{"id": "A", "text": "On Friday.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "On Sunday.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "On Tuesday.", "imagePath": null, "imageAlt": null}], "correctOptionId": "C", "explanationZhTW": "廣播提到因為大雨，運動會改到下星期二（Tuesday）舉行，週五照常上課，故選 (C)。", "skillTags": ["言談理解・校園廣播運動會改期"], "points": 1, "audioDurationSeconds": 25.0}, {"id": "gept-listening-01-q20", "number": 20, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q20.m4a", "transcript": [{"speaker": "F", "text": "Dad, what are we having for dinner tonight?"}, {"speaker": "M", "text": "We are making fish soup, beef noodles, and fried rice."}, {"speaker": "F", "text": "Do we have enough eggs for the fried rice?"}, {"speaker": "M", "text": "No, we only have one egg left. Please go to the supermarket and buy six eggs."}, {"speaker": "N", "text": "Question: What does the father ask the girl to buy?"}], "transcriptZhTW": [{"speaker": "F", "text": "爸爸，我們今晚吃什麼？"}, {"speaker": "M", "text": "我們要煮魚湯、牛肉麵和炒飯。"}, {"speaker": "F", "text": "炒飯的蛋夠用嗎？"}, {"speaker": "M", "text": "不夠，家裡只剩一顆蛋了。請去超市買六顆雞蛋回來。"}, {"speaker": "N", "text": "問題：爸爸請女孩去買什麼？"}], "translationZhTW": "女：爸爸，我們今晚吃什麼？\n男：我們要煮魚湯、牛肉麵和炒飯。\n女：炒飯的蛋夠用嗎？\n男：不夠，家裡只剩一顆蛋了。請去超市買六顆雞蛋回來。\n旁白：問題：爸爸請女孩去買什麼？", "options": [{"id": "A", "text": "Six eggs.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "Fish soup.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "Beef noodles.", "imagePath": null, "imageAlt": null}], "correctOptionId": "A", "explanationZhTW": "爸爸說家裡只剩一顆蛋，請女孩去超市買六顆雞蛋，故選 (A)。", "skillTags": ["言談理解・家庭晚餐準備採買"], "points": 1, "audioDurationSeconds": 26.4}, {"id": "gept-listening-01-q21", "number": 21, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q21.m4a", "transcript": [{"speaker": "M", "text": "Excuse me, I left my brown wallet on the bus this morning."}, {"speaker": "F", "text": "What was inside the wallet, sir?"}, {"speaker": "M", "text": "There was some cash, my student card, and a family picture."}, {"speaker": "F", "text": "Someone brought a brown wallet to our office twenty minutes ago. Please check if this is yours."}, {"speaker": "M", "text": "Yes, that is my wallet! Thank you very much."}, {"speaker": "N", "text": "Question: Where did the man lose his wallet?"}], "transcriptZhTW": [{"speaker": "M", "text": "不好意思，我今天早上把棕色皮夾忘在公車上了。"}, {"speaker": "F", "text": "先生，皮夾裡面放了什麼？"}, {"speaker": "M", "text": "有一些現金、我的學生證和一張全家福照片。"}, {"speaker": "F", "text": "二十分鐘前有人送來一個棕色皮夾到服務處，請確認一下是不是你的。"}, {"speaker": "M", "text": "是的，就是這個！非常謝謝你。"}, {"speaker": "N", "text": "問題：男子在哪裡遺失皮夾？"}], "translationZhTW": "男：不好意思，我今天早上把棕色皮夾忘在公車上了。\n女：先生，皮夾裡面放了什麼？\n男：有一些現金、我的學生證和一張全家福照片。\n女：二十分鐘前有人送來一個棕色皮夾到服務處，請確認一下是不是你的。\n男：是的，就是這個！非常謝謝你。\n旁白：問題：男子在哪裡遺失皮夾？", "options": [{"id": "A", "text": "In a restaurant.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "On a bus.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "At a train station.", "imagePath": null, "imageAlt": null}], "correctOptionId": "B", "explanationZhTW": "男子一開始說明今天早上把皮夾忘在公車上（on the bus），故選 (B)。", "skillTags": ["言談理解・失物招領協尋皮夾"], "points": 1, "audioDurationSeconds": 33.0}]}</script>
<script>
'use strict';
const BANK=JSON.parse(document.getElementById('bank-data').textContent),Q=BANK.questions,$=s=>document.querySelector(s),KEY='listening-lab-gept-elem-01-v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function audioSource(path){return path+'?v='+encodeURIComponent(BANK.audio.revision||'original-v1');}
const audio=$('#player');let state=null,screen='question',filter='all',speed=1,running=false,runToken=0,waitId=null,autoId=null,toastId=null,saveOK=true;
function blank(mode){return{version:1,bankId:BANK.bankId,mode,index:0,answers:Array(Q.length).fill(null),plays:Array(Q.length).fill(0),flags:[],checked:[],started:Date.now(),deadline:mode==='exam'?Date.now()+1500000:null,finished:false,finishedAt:null};}
try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.version===1&&x.bankId===BANK.bankId&&['practice','exam'].includes(x.mode)&&Array.isArray(x.answers)&&x.answers.length===Q.length&&x.answers.every(a=>a===null||'ABC'.includes(a))&&Array.isArray(x.plays)&&x.plays.length===Q.length&&x.plays.every(p=>Number.isInteger(p)&&p>=0)&&Number.isInteger(x.index)&&x.index>=0&&x.index<Q.length&&Array.isArray(x.flags)&&Array.isArray(x.checked)&&(!x.deadline||Number.isFinite(x.deadline)))state=x;}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));saveOK=true;}catch{saveOK=false;}}
function toast(t){clearTimeout(toastId);$('#toast').textContent=t;$('#toast').hidden=false;toastId=setTimeout(()=>$('#toast').hidden=true,4500);}
function ask(title,body,callback,label='確定'){const d=$('#modal');$('#modalTitle').textContent=title;$('#modalBody').textContent=body;$('#modalConfirm').textContent=label;$('#modalConfirm').onclick=()=>{d.close();callback();};$('#modalCancel').onclick=()=>d.close();d.showModal();}
function stop(){runToken++;clearTimeout(waitId);clearTimeout(autoId);audio.pause();audio.onended=null;audio.onerror=null;running=false;updatePlayback();}
function begin(mode){const act=()=>{stop();state=blank(mode);speed=1;save();screen='question';render();window.scrollTo(0,0);};if(state&&!state.finished)ask('開始新的練習？','目前未交卷的作答紀錄將被新的練習取代。',act,'開始新練習');else act();}
function answered(){return state.answers.filter(Boolean).length;}
function correct(i){return state.answers[i]===Q[i].correctOptionId;}
function render(){if(screen==='question')renderQuestion();else renderResults();updateClock();}
function navSection(s){return `<div class="side-title">${esc(s.name)} <span style="float:right">${s.start}–${s.end}</span></div><div class="nav-grid">${Q.filter(q=>q.sectionId===s.id).map(q=>{const i=q.number-1;return `<button class="nav-q ${state.answers[i]?'answered':''} ${state.index===i?'current':''} ${state.flags.includes(i)?'flagged':''}" aria-label="第 ${q.number} 題${state.answers[i]?'，已作答':''}${state.flags.includes(i)?'，待複習':''}" ${state.index===i?'aria-current="step"':''} onclick="go(${i})">${q.number}</button>`;}).join('')}</div>`;}
function renderQuestion(){const i=state.index,q=Q[i],section=BANK.sections.find(s=>s.id===q.sectionId),image=q.type==='image-choice';$('#app').innerHTML=`<div class="wrap"><div class="topline"><div><div class="eyebrow">GEPT ELEMENTARY PRACTICE 01</div><h2 style="margin:5px 0 0">${state.mode==='exam'?'模擬測驗':'自主練習'}</h2></div><div class="actions"><span class="timer" id="clock"></span><button class="btn secondary" onclick="confirmSubmit()">交卷計分</button></div></div><div class="workspace"><aside class="sidebar"><span class="eyebrow">YOUR ANSWER SHEET</span>${BANK.sections.map(navSection).join('')}<div class="legend"><span><i class="dot"></i>已作答</span><span><i class="dot orange"></i>待複習</span></div><p class="side-note">${state.mode==='exam'?'點播放後每題連播兩次，播畢 8 秒後自動前進。換題會停止目前語音。':'先抓住關鍵字，再試著理解完整語意。選好答案後，可以對答案或繼續下一題。'}</p></aside><main><div class="status-line"><span>已作答 <b>${answered()}</b> / 21 題</span><div class="overall-track"><span style="width:${answered()/21*100}%"></span></div><span>${esc(section.name)}</span></div><article class="question-panel"><div class="q-head"><span class="q-number">QUESTION ${String(q.number).padStart(2,'0')} <span style="color:#b0bbb3">/ 21</span></span><button class="flag-btn ${state.flags.includes(i)?'on':''}" aria-pressed="${state.flags.includes(i)}" onclick="flag()">⚑ ${state.flags.includes(i)?'已標記':'稍後複習'}</button></div><h3 class="instruction">${esc(q.instruction)}</h3><div class="audio-panel"><div class="audio-row"><button class="play" id="playBtn" onclick="togglePlay()" aria-label="播放本題兩次">▶</button><div class="audio-info"><div class="audio-title" id="audioStatus" role="status" aria-live="polite">準備好就按下播放</div><div class="audio-detail">M4A / AAC · 美式英語 · ${q.number<=11?'聆聽句子':'聆聽內容與問題'} · 每輪播放兩次</div></div><div class="wave" id="wave" aria-hidden="true">${[12,21,14,25,17,10,22,15,25,11,19,14].map(h=>`<i style="height:${h}px"></i>`).join('')}</div></div><div class="progress-track"><div class="progress-fill" id="audioProgress"></div></div><div class="audio-bottom"><span id="playCount"></span>${state.mode==='practice'?`<label>速度 <select id="speed" onchange="setSpeed(this.value)">${[.75,.85,1,1.15,1.25].map(n=>`<option value="${n}" ${n===speed?'selected':''}>${n}×</option>`).join('')}</select></label>`:'<span>固定 1× 語速</span>'}<span id="audioTime">00:00</span></div></div><div class="options ${image?'image-options':''} ${q.number===18?'map-options':''}" role="group" aria-label="第 ${q.number} 題選項">${q.options.map(o=>optionMarkup(q,i,o,image)).join('')}</div>${state.mode==='practice'&&state.checked.includes(i)?feedback(i):''}<div class="q-bottom"><button class="btn secondary" ${i===0?'disabled':''} onclick="go(${i-1})">← 上一題</button>${state.mode==='practice'?'<button class="btn quiet" onclick="check()">對答案</button>':'<span class="hint">交卷後可查看逐字稿與解析</span>'}<button class="btn" onclick="${i===20?'confirmSubmit()':`go(${i+1})`}">${i===20?'交卷計分':'下一題 →'}</button></div></article><div class="save-note">${saveOK?'● 作答紀錄自動保存在此瀏覽器':'此瀏覽器無法儲存進度，請在關閉前完成作答。'}</div></main></div></div>`;updatePlayback();}
function imageSource(path){return path+'?v='+encodeURIComponent(BANK.illustrations?.revision||'original');}
function optionMarkup(q,i,o,image){
 const choice=`<button class="option ${state.answers[i]===o.id?'selected':''}" aria-pressed="${state.answers[i]===o.id}" onclick="answer('${o.id}')"><span class="letter">${o.id}</span>${image?`<img src="${esc(imageSource(o.imagePath))}" alt="${esc(o.imageAlt)}" width="600" height="440">`:`<span lang="en">${esc(o.text)}</span>`}</button>`;
 return image?`<div class="image-choice">${choice}<button class="image-zoom" onclick="openImage(${i},'${o.id}')" aria-label="放大第 ${q.number} 題選項 ${o.id}">放大圖片 ↗</button></div>`:choice;
}
let zoomQuestion=0,zoomOption='A';
function openImage(i,id){
 const q=Q[i],o=q.options.find(o=>o.id===id);if(!o?.imagePath)return;
 zoomQuestion=i;zoomOption=id;$('#imageViewerTitle').textContent=`第 ${q.number} 題・選項 ${id}`;
 $('#imageViewerImg').src=imageSource(o.imagePath);$('#imageViewerImg').alt=o.imageAlt;
 $('#imageViewerTabs').innerHTML=q.options.map(x=>`<button class="filter ${x.id===id?'on':''}" aria-pressed="${x.id===id}" onclick="openImage(${i},'${x.id}')">圖片 ${x.id}</button>`).join('');
 if(!$('#imageViewer').open)$('#imageViewer').showModal();
}

function answer(id){state.answers[state.index]=id;save();const y=window.scrollY;render();window.scrollTo(0,y);}
function flag(){const i=state.index;state.flags=state.flags.includes(i)?state.flags.filter(x=>x!==i):[...state.flags,i];save();render();}
function go(i){if(i<0||i>=Q.length)return;if($('#imageViewer').open)$('#imageViewer').close();stop();state.index=i;save();render();window.scrollTo({top:0,behavior:'auto'});}
function setSpeed(v){speed=Number(v);audio.playbackRate=speed;}
function check(){if(!state.answers[state.index]){toast('請先選擇一個答案。');return;}if(!state.checked.includes(state.index))state.checked.push(state.index);save();render();}
function bilingualTranscript(q){const en={N:'Narrator',M:'Male',F:'Female'},zh={N:'旁白',M:'男聲',F:'女聲'};return `<div class="bilingual-transcript">${q.transcript.map((line,i)=>`<div class="transcript-pair"><p class="transcript-en" lang="en"><b>${en[line.speaker]}:</b> ${esc(line.text)}</p><p class="transcript-zh" lang="zh-TW"><b>${zh[q.transcriptZhTW[i].speaker]}：</b> ${esc(q.transcriptZhTW[i].text)}</p></div>`).join('')}</div>`;}
function feedback(i){const q=Q[i];return `<div class="feedback ${correct(i)?'':'bad'}"><h3>${correct(i)?'✓ 答對了':'再聽一次，留意關鍵線索'} · 正解 ${q.correctOptionId}</h3><p>${esc(q.explanationZhTW)}</p><details><summary>查看英文逐字稿與逐句中文翻譯</summary>${bilingualTranscript(q)}</details></div>`;}
function togglePlay(){if(running){stop();toast('已停止播放。');return;}playQuestion();}
function updatePlayback(text){if(!state||screen!=='question')return;const n=state.plays[state.index],exam=state.mode==='exam',b=$('#playBtn');if(!b)return;b.textContent=running?'■':'▶';b.disabled=!running&&exam&&n>=2;b.setAttribute('aria-label',running?'停止播放與自動換題':exam&&n>=2?'本題已達播放上限':'播放本題');$('#wave').classList.toggle('active',running&&!audio.paused);$('#playCount').textContent=exam?`已用 ${n} / 2 次`:'可不限次重聽 · 每輪兩次';$('#audioStatus').textContent=text||(running?'正在聆聽…':exam&&n>=2?'已達本題播放上限':'準備好就按下播放');}
function playQuestion(){if(!state||state.finished||screen!=='question')return;const i=state.index,exam=state.mode==='exam';if(exam&&state.plays[i]>=2)return;stop();running=true;const token=runToken;let remaining=exam?2-state.plays[i]:2;audio.src=audioSource(Q[i].audioPath);audio.playbackRate=exam?1:speed;const fail=()=>{if(token!==runToken)return;stop();toast('音檔無法播放，請檢查網路連線，並在瀏覽器允許播放聲音後再試。');};const once=()=>{if(token!==runToken)return;audio.currentTime=0;audio.onended=()=>{if(token!==runToken)return;remaining--;if(remaining>0){updatePlayback('稍候 2 秒，再聽一次…');waitId=setTimeout(once,2000);}else{updatePlayback(exam?'本題播畢，8 秒後前往下一題…':'本輪已播放兩次');if(exam&&i<Q.length-1){autoId=setTimeout(()=>{if(token!==runToken)return;go(i+1);playQuestion();},8000);}else{running=false;updatePlayback(exam?'全卷播畢，可檢查答案後交卷':'本輪已播放兩次，可再重聽');}}};audio.onerror=fail;audio.play().then(()=>{if(token!==runToken)return;state.plays[i]++;save();updatePlayback(`正在播放 · 本輪第 ${exam?state.plays[i]:3-remaining} / 2 次`);}).catch(fail);};once();updatePlayback();}
audio.ontimeupdate=()=>{if(screen!=='question'||!$('#audioProgress'))return;$('#audioProgress').style.width=(Number.isFinite(audio.duration)?audio.currentTime/audio.duration*100:0)+'%';$('#audioTime').textContent=time(audio.currentTime);};
function time(s){s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function updateClock(){if(!state||state.finished)return;if(state.deadline&&Date.now()>=state.deadline){submit(true);return;}if(!$('#clock'))return;const sec=state.deadline?(state.deadline-Date.now())/1000:(Date.now()-state.started)/1000;$('#clock').textContent=(state.deadline?'剩餘 ':'已用 ')+time(sec);$('#clock').classList.toggle('urgent',!!state.deadline&&sec<180);}
setInterval(updateClock,1000);
function confirmSubmit(){stop();const missing=21-answered();ask('交卷並查看成績？',missing?`還有 ${missing} 題未作答，未作答題目將以 0 分計算。交卷後可查看所有解析。`:'21 題都已完成，交卷後可查看成績、逐字稿與解析。',()=>submit(false),'交卷計分');}
function submit(timeout){if($('#imageViewer').open)$('#imageViewer').close();stop();if(!state||state.finished)return;state.finished=true;state.finishedAt=state.deadline&&timeout?state.deadline:Date.now();save();screen='results';filter='all';render();window.scrollTo(0,0);if(timeout)toast('25 分鐘已到，已自動交卷。');}
function reviewOptions(q){if(q.type==='image-choice')return `<div class="review-images">${q.options.map(o=>`<figure><img src="${esc(imageSource(o.imagePath))}" alt="${esc(o.imageAlt)}"><figcaption>${o.id}${o.id===q.correctOptionId?' ✓':''}</figcaption></figure>`).join('')}</div>`;return `<div class="review-options" lang="en">${q.options.map(o=>`<div class="${o.id===q.correctOptionId?'correct':''}">${o.id}. ${esc(o.text)} ${o.id===q.correctOptionId?'✓':''}</div>`).join('')}</div>`;}
function renderResults(){const score=Q.filter((q,i)=>correct(i)).length,wrong=21-score,seconds=((state.finishedAt||Date.now())-state.started)/1000;$('#app').innerHTML=`<div class="wrap"><div class="topline"><div><div class="eyebrow">YOUR LISTENING REPORT</div><h2 style="margin:5px 0 0">每一次練習，都有收穫。</h2></div><span class="screen-label">${state.mode==='exam'?'模擬測驗':'自主練習'} · 用時 ${time(seconds)}</span></div><section class="score-hero"><div class="score-ring"><strong>${score}</strong><small>/ 21 分</small></div><div><div class="eyebrow" style="color:#b5cfbf">ACCURACY ${Math.round(score/21*100)}%</div><h2>${score>=18?'聽得仔細，繼續保持。':score>=12?'掌握線索，再往前一步。':'重聽關鍵句，慢慢建立把握。'}</h2><p>答對 ${score} 題 · 答錯 ${answered()-score} 題 · 未作答 ${21-answered()} 題<br>此為練習原始分數，不換算官方會考等級。</p></div></section><div class="result-stats">${BANK.sections.map(s=>{const indexes=Q.map((q,i)=>q.sectionId===s.id?i:-1).filter(i=>i>=0);return `<div class="stat">${s.name}<strong>${indexes.filter(correct).length} <span class="screen-label">/ ${indexes.length} 題</span></strong></div>`;}).join('')}</div><div class="actions" style="margin-bottom:32px"><button class="btn" onclick="retryWrong()" ${!wrong?'disabled':''}>練習錯題與未答題 (${wrong})</button><button class="btn secondary" onclick="restart()">重新測驗</button><button class="btn secondary" onclick="exportResults()">匯出作答 JSON</button><button class="btn quiet" onclick="printReport()">列印解析</button></div><div class="topline"><h2 style="font-size:21px;margin:0">逐題回顧</h2><div class="actions"><button class="filter ${filter==='all'?'on':''}" onclick="setFilter('all')">全部 21 題</button><button class="filter ${filter==='wrong'?'on':''}" onclick="setFilter('wrong')">錯題與未答 ${wrong}</button></div></div><div>${Q.map((q,i)=>{if(filter==='wrong'&&correct(i))return '';return `<article class="review-card"><h3><span>第 ${q.number} 題 <span class="screen-label">· ${esc(q.skillTags.join('、'))}</span></span><span class="review-status ${correct(i)?'':'bad'}">${correct(i)?'✓ 答對':state.answers[i]?'✕ 答錯':'— 未作答'}</span></h3><p class="answerline">你的答案：${state.answers[i]||'未作答'}　正確答案：${q.correctOptionId}</p>${reviewOptions(q)}<p style="font-size:14px;margin-bottom:12px">${esc(q.explanationZhTW)}</p><button class="btn secondary" style="padding:6px 12px;font-size:12px" onclick="reviewListen(${i})">▶ 重聽本題</button><details><summary style="font-size:13px">英文逐字稿與逐句中文翻譯</summary>${bilingualTranscript(q)}</details></article>`;}).join('')||'<div class="empty">全部答對了，沒有錯題！</div>'}</div><p class="notice">重聽時，先找出自己漏聽的字，再用逐字稿確認。語音、圖片與選項均為原創練習素材。</p></div>`;}
function setFilter(v){stop();filter=v;renderResults();}
function reviewListen(i){stop();audio.src=audioSource(Q[i].audioPath);audio.playbackRate=speed;audio.play().catch(()=>toast('音檔無法播放，請檢查網路連線後再試。'));}
function restart(){ask('重新作答整份試卷？','目前顯示的成績將由新紀錄取代。可以先匯出作答 JSON 保存這次結果。',()=>{state=null;begin('exam');},'重新測驗');}
function retryWrong(){const ids=Q.map((q,i)=>correct(i)?-1:i).filter(i=>i>=0);if(!ids.length)return;ask('開始訂正錯題？','將進入自主練習模式，保留答對題的答案，清空錯題與未答題；可先匯出目前成績。',()=>{stop();state=blank('practice');Q.forEach((q,i)=>{if(!ids.includes(i))state.answers[i]=q.correctOptionId;});state.index=ids[0];state.flags=ids;save();screen='question';render();window.scrollTo(0,0);},'開始訂正');}
function exportResults(){const data={schemaVersion:'1.0.0',bankId:BANK.bankId,audioRevision:BANK.audio.revision||'original-v1',mode:state.mode,startedAt:new Date(state.started).toISOString(),submittedAt:new Date(state.finishedAt).toISOString(),score:Q.filter((q,i)=>correct(i)).length,maxScore:21,answers:Q.map((q,i)=>({questionId:q.id,selectedOptionId:state.answers[i],correctOptionId:q.correctOptionId,isCorrect:correct(i),playCount:state.plays[i]}))};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='listening-results-'+new Date(state.finishedAt).toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function printReport(){stop();filter='all';renderResults();document.querySelectorAll('.review-card details').forEach(d=>d.open=true);window.print();}
$('#imageViewer').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();openImage(zoomQuestion,'ABC'[('ABC'.indexOf(zoomOption)+(e.key==='ArrowRight'?1:2))%3]);}});
// Resume an unfinished exam; otherwise start a new exam immediately.
if(!state||state.mode!=='exam'||state.finished)state=blank('exam');
save();
if(state.deadline&&Date.now()>=state.deadline)submit(true);else render();
</script>

<script>
// Isolated Blogger embed support; no answers or other student data are sent to the parent page.
(function(){
  if(window.parent===window||new URLSearchParams(location.search).get('embed')!=='blogger')return;
  const bankId='cap-listening-gept-elem-01';
  let parentOrigin='*',queued=false,lastHeight=0,lastPosition=screen+':'+state.index;
  function send(type,extra){window.parent.postMessage(Object.assign({type,bankId},extra||{}),parentOrigin);}
  function measure(force){
    const height=Math.ceil(document.body.getBoundingClientRect().height)+2;
    if(force||height!==lastHeight){lastHeight=height;send('listening-exam:height',{height});}
  }
  function schedule(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;measure(false);});}
  const originalOpenImage=openImage;
  openImage=function(){originalOpenImage.apply(this,arguments);send('listening-exam:navigate');};
  const originalAsk=ask;
  ask=function(){originalAsk.apply(this,arguments);send('listening-exam:navigate');};
  const originalRender=render;
  render=function(){
    originalRender();
    const position=screen+':'+state.index;
    if(position!==lastPosition){lastPosition=position;send('listening-exam:navigate');}
    schedule();
  };
  addEventListener('message',event=>{
    if(event.source!==window.parent||!event.data||event.data.type!=='listening-exam:measure'||event.data.bankId!==bankId)return;
    if(event.origin!=='null')parentOrigin=event.origin;
    measure(true);
  });
  if(window.ResizeObserver)new ResizeObserver(schedule).observe(document.body);
  else new MutationObserver(schedule).observe(document.getElementById('app'),{childList:true,subtree:true});
  addEventListener('resize',schedule);
  document.addEventListener('load',schedule,true);
  measure(true);
})();
</script>
</body>
