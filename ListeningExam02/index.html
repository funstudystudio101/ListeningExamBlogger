蛋糕和咖啡要付多少錢？"}], "translationZhTW": "女：午安，需要幫忙嗎？\n男：是的，我想要買兩個草莓蛋糕和一杯黑咖啡。\n女：每個蛋糕四十元，咖啡三十元。\n男：這是一百五十元。\n女：謝謝你，找你四十元。\n旁白：問題：男孩買蛋糕和咖啡要付多少錢？", "options": [{"id": "A", "text": "Seventy dollars.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "Eighty dollars.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "One hundred and ten dollars.", "imagePath": null, "imageAlt": null}], "correctOptionId": "C", "explanationZhTW": "兩個草莓蛋糕共 80 元，加上一杯 30 元的咖啡，總計 110 元（付 150 元找 40 元），故選 (C)。", "skillTags": ["言談理解・麵包店蛋糕咖啡結帳"], "points": 1, "audioDurationSeconds": 32.1}, {"id": "gept-listening-02-q13", "number": 13, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q13.m4a", "transcript": [{"speaker": "M", "text": "When should we meet to study for our math exam?"}, {"speaker": "F", "text": "How about Saturday morning? The library opens at eight thirty."}, {"speaker": "M", "text": "Let us meet half an hour after it opens, so we can get good seats."}, {"speaker": "F", "text": "Sounds good. See you at nine o'clock."}, {"speaker": "N", "text": "Question: What time will the students meet on Saturday?"}], "transcriptZhTW": [{"speaker": "M", "text": "我們什麼時候碰面準備數學考試？"}, {"speaker": "F", "text": "星期六早上怎麼樣？圖書館八點半開門。"}, {"speaker": "M", "text": "那我們開門後半小時集合，這樣能找到好位子。"}, {"speaker": "F", "text": "聽起來不錯，九點見。"}, {"speaker": "N", "text": "問題：學生星期六將在幾點集合？"}], "translationZhTW": "男：我們什麼時候碰面準備數學考試？\n女：星期六早上怎麼樣？圖書館八點半開門。\n男：那我們開門後半小時集合，這樣能找到好位子。\n女：聽起來不錯，九點見。\n旁白：問題：學生星期六將在幾點集合？", "options": [{"id": "A", "text": "At nine o'clock.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "At eight thirty.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "At nine thirty.", "imagePath": null, "imageAlt": null}], "correctOptionId": "A", "explanationZhTW": "圖書館八點半開門，學生約在開門後半小時（即九點整 9:00）碰面，故選 (A)。", "skillTags": ["言談理解・數學讀書會碰面時間"], "points": 1, "audioDurationSeconds": 27.2}, {"id": "gept-listening-02-q14", "number": 14, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q14.m4a", "transcript": [{"speaker": "F", "text": "Two tickets for the animal cartoon at two o'clock, please."}, {"speaker": "M", "text": "The front seats are all taken, but the back row is available."}, {"speaker": "F", "text": "The back row is fine for us."}, {"speaker": "M", "text": "That will be four hundred dollars altogether."}, {"speaker": "N", "text": "Question: Where will the woman and her friend sit?"}], "transcriptZhTW": [{"speaker": "F", "text": "請給我兩張兩點場次的動物卡通電影票。"}, {"speaker": "M", "text": "前面的位子都客滿了，不過最後一排還有空位。"}, {"speaker": "F", "text": "最後一排對我們來說很好。"}, {"speaker": "M", "text": "總共是四百元。"}, {"speaker": "N", "text": "問題：女子和朋友會坐在哪裡？"}], "translationZhTW": "女：請給我兩張兩點場次的動物卡通電影票。\n男：前面的位子都客滿了，不過最後一排還有空位。\n女：最後一排對我們來說很好。\n男：總共是四百元。\n旁白：問題：女子和朋友會坐在哪裡？", "options": [{"id": "A", "text": "In the front row.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "In the back row.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "Outside the theater.", "imagePath": null, "imageAlt": null}], "correctOptionId": "B", "explanationZhTW": "售票員說明前排已滿但後排有空位，女子同意坐後排（back row），故選 (B)。", "skillTags": ["言談理解・電影院購票選位"], "points": 1, "audioDurationSeconds": 23.9}, {"id": "gept-listening-02-q15", "number": 15, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q15.m4a", "transcript": [{"speaker": "M", "text": "Excuse me, does this bus go to the city museum?"}, {"speaker": "F", "text": "No, this is bus number twelve. You need to take bus number twenty."}, {"speaker": "M", "text": "Where can I catch bus number twenty?"}, {"speaker": "F", "text": "Cross the street and wait in front of the post office."}, {"speaker": "N", "text": "Question: Which bus should the man take to the museum?"}], "transcriptZhTW": [{"speaker": "M", "text": "不好意思，這班公車有到市立博物館嗎？"}, {"speaker": "F", "text": "沒有，這是十二路公車。你需要搭二十路公車。"}, {"speaker": "M", "text": "我在哪裡可以搭到二十路公車？"}, {"speaker": "F", "text": "過馬路到郵局前面等車就可以了。"}, {"speaker": "N", "text": "問題：男子應該搭幾路公車去博物館？"}], "translationZhTW": "男：不好意思，這班公車有到市立博物館嗎？\n女：沒有，這是十二路公車。你需要搭二十路公車。\n男：我在哪裡可以搭到二十路公車？\n女：過馬路到郵局前面等車就可以了。\n旁白：問題：男子應該搭幾路公車去博物館？", "options": [{"id": "A", "text": "Bus number twenty.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "Bus number twelve.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "Bus number two.", "imagePath": null, "imageAlt": null}], "correctOptionId": "A", "explanationZhTW": "女子明確告知要搭 20 路公車（bus number twenty）才能抵達博物館，故選 (A)。", "skillTags": ["言談理解・詢問前往博物館的公車"], "points": 1, "audioDurationSeconds": 25.8}, {"id": "gept-listening-02-q16", "number": 16, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q16.m4a", "transcript": [{"speaker": "F", "text": "The weather report says it will be stormy tomorrow."}, {"speaker": "M", "text": "Then we should cancel our picnic by the river."}, {"speaker": "F", "text": "Where should we go then?"}, {"speaker": "M", "text": "Let us visit the art museum in the city."}, {"speaker": "F", "text": "That is a great idea. It will keep us dry."}, {"speaker": "N", "text": "Question: Where will they go tomorrow?"}], "transcriptZhTW": [{"speaker": "F", "text": "氣象預報說明天會有暴風雨。"}, {"speaker": "M", "text": "那我們應該取消河邊的野餐了。"}, {"speaker": "F", "text": "那我們要去哪裡呢？"}, {"speaker": "M", "text": "我們去參觀市區的美術館吧。"}, {"speaker": "F", "text": "好主意，這樣我們就不會淋濕了。"}, {"speaker": "N", "text": "問題：他們明天將會去哪裡？"}], "translationZhTW": "女：氣象預報說明天會有暴風雨。\n男：那我們應該取消河邊的野餐了。\n女：那我們要去哪裡呢？\n男：我們去參觀市區的美術館吧。\n女：好主意，這樣我們就不會淋濕了。\n旁白：問題：他們明天將會去哪裡？", "options": [{"id": "A", "text": "To the river.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "To the art museum.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "To the beach.", "imagePath": null, "imageAlt": null}], "correctOptionId": "B", "explanationZhTW": "因為預報明天有暴風雨，他們決定取消河邊野餐，改去市區美術館（art museum），故選 (B)。", "skillTags": ["言談理解・雨天備案改去美術館"], "points": 1, "audioDurationSeconds": 25.9}, {"id": "gept-listening-02-q17", "number": 17, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q17.m4a", "transcript": [{"speaker": "M", "text": "Are you going to the camera club meeting after school?"}, {"speaker": "F", "text": "Yes. The teacher will show us how to take pictures of birds."}, {"speaker": "M", "text": "Do you have your own camera?"}, {"speaker": "F", "text": "No, but my brother will lend me his camera today."}, {"speaker": "N", "text": "Question: Whose camera will the girl use?"}], "transcriptZhTW": [{"speaker": "M", "text": "你放學後會去參加攝影社的聚會嗎？"}, {"speaker": "F", "text": "會啊，老師要教我們怎麼拍鳥類的照片。"}, {"speaker": "M", "text": "你有自己的相機嗎？"}, {"speaker": "F", "text": "沒有，不過我哥哥今天會把他的相機借給我。"}, {"speaker": "N", "text": "問題：女孩將會使用誰的相機？"}], "translationZhTW": "男：你放學後會去參加攝影社的聚會嗎？\n女：會啊，老師要教我們怎麼拍鳥類的照片。\n男：你有自己的相機嗎？\n女：沒有，不過我哥哥今天會把他的相機借給我。\n旁白：問題：女孩將會使用誰的相機？", "options": [{"id": "A", "text": "The teacher's camera.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "Her own camera.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "Her brother's camera.", "imagePath": null, "imageAlt": null}], "correctOptionId": "C", "explanationZhTW": "女孩表示哥哥今天會借相機給她，因此她用的是哥哥的相機（Her brother's camera），故選 (C)。", "skillTags": ["言談理解・攝影社借相機"], "points": 1, "audioDurationSeconds": 23.9}, {"id": "gept-listening-02-q18", "number": 18, "sectionId": "dialogue", "type": "image-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q18.m4a", "transcript": [{"speaker": "F", "text": "Look at the school map. The library is north of the main gate."}, {"speaker": "M", "text": "Where is our science classroom? Our teacher said it is near the garden."}, {"speaker": "F", "text": "The science classroom is east of the library, right next to the garden."}, {"speaker": "M", "text": "I see it now. Let us hurry before the bell rings."}, {"speaker": "N", "text": "Question: Which room will the students go to?"}], "transcriptZhTW": [{"speaker": "F", "text": "看學校地圖，圖書館在校門口北邊。"}, {"speaker": "M", "text": "我們的自然教室在哪裡？老師說靠近花園。"}, {"speaker": "F", "text": "自然教室在圖書館東邊，就在花園正旁邊。"}, {"speaker": "M", "text": "我現在看懂了，在打鐘前快走吧。"}, {"speaker": "N", "text": "問題：學生要去哪一間教室？"}], "translationZhTW": "女：看學校地圖，圖書館在校門口北邊。\n男：我們的自然教室在哪裡？老師說靠近花園。\n女：自然教室在圖書館東邊，就在花園正旁邊。\n男：我現在看懂了，在打鐘前快走吧。\n旁白：問題：學生要去哪一間教室？", "options": [{"id": "A", "text": null, "imagePath": "images/campus-map-gym.svg", "imageAlt": "Campus map highlighting the Gym"}, {"id": "B", "text": null, "imagePath": "images/campus-map-science-room.svg", "imageAlt": "Campus map highlighting the Science Room"}, {"id": "C", "text": null, "imagePath": "images/campus-map-computer-room.svg", "imageAlt": "Campus map highlighting the Computer Room"}], "correctOptionId": "B", "explanationZhTW": "學生要前往自然教室，地圖顯示自然教室在圖書館東側且緊鄰花園，故選 (B)。", "skillTags": ["言談理解・校園地圖找自然實驗教室"], "points": 1, "audioDurationSeconds": 29.7}, {"id": "gept-listening-02-q19", "number": 19, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q19.m4a", "transcript": [{"speaker": "F", "text": "Good evening, library visitors. The city library will close early tonight at seven o'clock for the holiday. Please return all borrowed books to the front desk before six thirty. We will be open again on Monday morning at nine. Thank you and have a wonderful holiday."}, {"speaker": "N", "text": "Question: What time will the library close tonight?"}], "transcriptZhTW": [{"speaker": "F", "text": "各位讀者晚安。市立圖書館今晚因節日將在七點提早閉館。請在六點半前將所有借閱書籍歸還至服務台。我們將於星期一上午九點重新開放，謝謝大家並祝假期愉快。"}, {"speaker": "N", "text": "問題：圖書館今晚幾點閉館？"}], "translationZhTW": "女：各位讀者晚安。市立圖書館今晚因節日將在七點提早閉館。請在六點半前將所有借閱書籍歸還至服務台。我們將於星期一上午九點重新開放，謝謝大家並祝假期愉快。\n旁白：問題：圖書館今晚幾點閉館？", "options": [{"id": "A", "text": "At six thirty.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "At nine o'clock.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "At seven o'clock.", "imagePath": null, "imageAlt": null}], "correctOptionId": "C", "explanationZhTW": "廣播明確說明因假日圖書館今晚提早於七點（seven o'clock）閉館，六點半是還書截止時間，故選 (C)。", "skillTags": ["言談理解・圖書館閉館時間廣播"], "points": 1, "audioDurationSeconds": 26.5}, {"id": "gept-listening-02-q20", "number": 20, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q20.m4a", "transcript": [{"speaker": "M", "text": "What should we buy for our mother's birthday?"}, {"speaker": "F", "text": "She loves drinking tea, but she needs a new teapot."}, {"speaker": "M", "text": "We could get her a beautiful purple teapot from the department store."}, {"speaker": "F", "text": "That sounds like a wonderful gift. Let us go and buy it now."}, {"speaker": "N", "text": "Question: What gift will they buy for their mother?"}], "transcriptZhTW": [{"speaker": "M", "text": "我們應該買什麼當作媽媽的生日禮物？"}, {"speaker": "F", "text": "她很喜歡喝茶，而且她正需要一個新茶壺。"}, {"speaker": "M", "text": "我們可以去百貨公司買一個漂亮的紫色茶壺送給她。"}, {"speaker": "F", "text": "聽起來是很棒的禮物，我們現在就去買吧。"}, {"speaker": "N", "text": "問題：他們將會買什麼禮物送給媽媽？"}], "translationZhTW": "男：我們應該買什麼當作媽媽的生日禮物？\n女：她很喜歡喝茶，而且她正需要一個新茶壺。\n男：我們可以去百貨公司買一個漂亮的紫色茶壺送給她。\n女：聽起來是很棒的禮物，我們現在就去買吧。\n旁白：問題：他們將會買什麼禮物送給媽媽？", "options": [{"id": "A", "text": "A purple teapot.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "A warm jacket.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "A box of cakes.", "imagePath": null, "imageAlt": null}], "correctOptionId": "A", "explanationZhTW": "對話中兩人決定去百貨公司買一個漂亮的紫色茶壺（purple teapot）送給愛喝茶的媽媽，故選 (A)。", "skillTags": ["言談理解・挑選媽媽生日禮物"], "points": 1, "audioDurationSeconds": 26.0}, {"id": "gept-listening-02-q21", "number": 21, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q21.m4a", "transcript": [{"speaker": "F", "text": "How do you make this delicious tomato soup?"}, {"speaker": "M", "text": "First, cook the onions with butter in a pot."}, {"speaker": "F", "text": "Do you add the tomatoes next?"}, {"speaker": "M", "text": "Yes. Then add the tomatoes, water, and some salt. Cook them for twenty minutes."}, {"speaker": "N", "text": "Question: How long should the tomatoes cook in the pot?"}], "transcriptZhTW": [{"speaker": "F", "text": "你怎麼做出這道美味番茄湯的？"}, {"speaker": "M", "text": "首先，在鍋子裡用奶油炒洋蔥。"}, {"speaker": "F", "text": "接下來加番茄嗎？"}, {"speaker": "M", "text": "對，接著加入番茄、水和少許鹽，煮二十分鐘。"}, {"speaker": "N", "text": "問題：番茄在鍋子裡要煮多久？"}], "translationZhTW": "女：你怎麼做出這道美味番茄湯的？\n男：首先，在鍋子裡用奶油炒洋蔥。\n女：接下來加番茄嗎？\n男：對，接著加入番茄、水和少許鹽，煮二十分鐘。\n旁白：問題：番茄在鍋子裡要煮多久？", "options": [{"id": "A", "text": "For ten minutes.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "For twenty minutes.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "For thirty minutes.", "imagePath": null, "imageAlt": null}], "correctOptionId": "B", "explanationZhTW": "男孩說明加入番茄、水和鹽後，需要在鍋中煮二十分鐘（twenty minutes），故選 (B)。", "skillTags": ["言談理解・煮番茄湯的烹飪時間"], "points": 1, "audioDurationSeconds": 26.7}]}</script>
<script>
'use strict';
const BANK=JSON.parse(document.getElementById('bank-data').textContent),Q=BANK.questions,$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function audioSource(path){return path+'?v='+encodeURIComponent(BANK.audio.revision||'original-v1');}
const audio=$('#player');let state=null,screen='question',filter='all',speed=1,running=false,runToken=0,waitId=null,autoId=null,toastId=null;
function blank(mode){return{version:1,bankId:BANK.bankId,mode,index:0,answers:Array(Q.length).fill(null),plays:Array(Q.length).fill(0),flags:[],checked:[],started:Date.now(),deadline:mode==='exam'?Date.now()+1500000:null,finished:false,finishedAt:null};}
function toast(t){clearTimeout(toastId);$('#toast').textContent=t;$('#toast').hidden=false;toastId=setTimeout(()=>$('#toast').hidden=true,4500);}
function ask(title,body,callback,label='確定'){const d=$('#modal');$('#modalTitle').textContent=title;$('#modalBody').textContent=body;$('#modalConfirm').textContent=label;$('#modalConfirm').onclick=()=>{d.close();callback();};$('#modalCancel').onclick=()=>d.close();d.showModal();}
function stop(){runToken++;clearTimeout(waitId);clearTimeout(autoId);audio.pause();audio.onended=null;audio.onerror=null;running=false;updatePlayback();}
function begin(mode){const act=()=>{stop();state=blank(mode);speed=1;screen='question';render();window.scrollTo(0,0);};if(state&&!state.finished)ask('開始新的練習？','目前未交卷的作答紀錄將被新的練習取代。',act,'開始新練習');else act();}
function answered(){return state.answers.filter(Boolean).length;}
function correct(i){return state.answers[i]===Q[i].correctOptionId;}
function render(){if(screen==='question')renderQuestion();else renderResults();updateClock();}
function navSection(s){return `<section class="nav-section"><div class="side-title">${esc(s.name)} <span style="float:right">${s.start}–${s.end}</span></div><div class="nav-grid">${Q.filter(q=>q.sectionId===s.id).map(q=>{const i=q.number-1;return `<button class="nav-q ${state.answers[i]?'answered':''} ${state.index===i?'current':''} ${state.flags.includes(i)?'flagged':''}" aria-label="第 ${q.number} 題${state.answers[i]?'，已作答':''}${state.flags.includes(i)?'，待複習':''}" ${state.index===i?'aria-current="step"':''} onclick="go(${i})">${q.number}</button>`;}).join('')}</div></section>`;}
function renderQuestion(){const i=state.index,q=Q[i],section=BANK.sections.find(s=>s.id===q.sectionId),image=q.type==='image-choice';$('#app').innerHTML=`<div class="wrap"><div class="topline"><div><div class="eyebrow">GEPT ELEMENTARY PRACTICE 02</div><h2 style="margin:5px 0 0">${state.mode==='exam'?'模擬測驗':'自主練習'}</h2></div><div class="actions"><span class="timer" id="clock"></span><button class="btn secondary" onclick="confirmSubmit()">交卷計分</button></div></div><div class="workspace"><main><div class="status-line"><span>已作答 <b>${answered()}</b> / 21 題</span><div class="overall-track"><span style="width:${answered()/21*100}%"></span></div><span>${esc(section.name)}</span></div><article class="question-panel"><div class="q-head"><span class="q-number">QUESTION ${String(q.number).padStart(2,'0')} <span style="color:#b0bbb3">/ 21</span></span><button class="flag-btn ${state.flags.includes(i)?'on':''}" aria-pressed="${state.flags.includes(i)}" onclick="flag()">⚑ ${state.flags.includes(i)?'已標記':'稍後複習'}</button></div><h3 class="instruction">${esc(q.instruction)}</h3><div class="audio-panel"><div class="audio-row"><button class="play" id="playBtn" onclick="togglePlay()" aria-label="播放本題兩次">▶</button><div class="audio-info"><div class="audio-title" id="audioStatus" role="status" aria-live="polite">準備好就按下播放</div><div class="audio-detail">M4A / AAC · 美式英語 · ${q.number<=11?'聆聽句子':'聆聽內容與問題'} · 每輪播放兩次</div></div><div class="wave" id="wave" aria-hidden="true">${[12,21,14,25,17,10,22,15,25,11,19,14].map(h=>`<i style="height:${h}px"></i>`).join('')}</div></div><div class="progress-track"><div class="progress-fill" id="audioProgress"></div></div><div class="audio-bottom"><span id="playCount"></span>${state.mode==='practice'?`<label>速度 <select id="speed" onchange="setSpeed(this.value)">${[.75,.85,1,1.15,1.25].map(n=>`<option value="${n}" ${n===speed?'selected':''}>${n}×</option>`).join('')}</select></label>`:'<span>固定 1× 語速</span>'}<span id="audioTime">00:00</span></div></div><div class="options ${image?'image-options':''} ${q.number===18?'map-options':''}" role="group" aria-label="第 ${q.number} 題選項">${q.options.map(o=>optionMarkup(q,i,o,image)).join('')}</div>${state.mode==='practice'&&state.checked.includes(i)?feedback(i):''}<div class="q-bottom"><button class="btn secondary" ${i===0?'disabled':''} onclick="go(${i-1})">← 上一題</button>${state.mode==='practice'?'<button class="btn quiet" onclick="check()">對答案</button>':'<span class="hint">交卷後可查看逐字稿與解析</span>'}<button class="btn" onclick="${i===20?'confirmSubmit()':`go(${i+1})`}">${i===20?'交卷計分':'下一題 →'}</button></div></article><div class="save-note">每次重新進入或重新整理頁面，測驗都會重置，請在離開前完成作答。</div></main><aside class="sidebar"><span class="eyebrow">YOUR ANSWER SHEET</span><div class="nav-sections">${BANK.sections.map(navSection).join('')}</div><div class="legend"><span><i class="dot"></i>已作答</span><span><i class="dot orange"></i>待複習</span></div><p class="side-note">${state.mode==='exam'?'點播放後每題連播兩次，播畢 8 秒後自動前進。換題會停止目前語音。':'先抓住關鍵字，再試著理解完整語意。選好答案後，可以對答案或繼續下一題。'}</p></aside></div></div>`;updatePlayback();}
function imageSource(path){return path+'?v='+encodeURIComponent(BANK.illustrations?.revision||'original');}
function optionMarkup(q,i,o,image){
 const choice=`<button class="option ${state.answers[i]===o.id?'selected':''}" aria-pressed="${state.answers[i]===o.id}" onclick="answer('${o.id}')"><span class="letter">${o.id}</span>${image?`<img src="${esc(imageSource(o.imagePath))}" alt="${esc(o.imageAlt)}" width="600" height="440">`:`<span lang="en">${esc(o.text)}</span>`}</button>`;
 return image?`<div class="image-choice">${choice}<button class="image-zoom" onclick="openImage(${i},'${o.id}')" aria-label="放大第 ${q.number} 題選項 ${o.id}">放大圖片 ↗</button></div>`:choice;
}
let zoomQuestion=0,zoomOption='A';
function openImage(i,id){
 const q=Q[i],o=q.options.find(o=>o.id===id);if(!o?.imagePath)return;
 zoomQuestion=i;zoomOption=id;$('#imageViewerTitle').textContent=`第 ${q.number} 題・選項 ${id}`;
 $('#imageViewerImg').src=imageSource(o.imagePath);$('#imageViewerImg').alt=o.imageAlt;
 $('#imageViewerTabs').innerHTML=q.options.map(x=>`<button class="filter ${x.id===id?'on':''}" aria-pressed="${x.id===id}" onclick="openImage(${i},'${x.id}')">圖片 ${x.id}</button>`).join('');
 if(!$('#imageViewer').open)$('#imageViewer').showModal();
}

function answer(id){state.answers[state.index]=id;const y=window.scrollY;render();window.scrollTo(0,y);}
function flag(){const i=state.index;state.flags=state.flags.includes(i)?state.flags.filter(x=>x!==i):[...state.flags,i];render();}
function go(i){if(i<0||i>=Q.length)return;if($('#imageViewer').open)$('#imageViewer').close();stop();state.index=i;render();window.scrollTo({top:0,behavior:'auto'});}
function setSpeed(v){speed=Number(v);audio.playbackRate=speed;}
function check(){if(!state.answers[state.index]){toast('請先選擇一個答案。');return;}if(!state.checked.includes(state.index))state.checked.push(state.index);render();}
function bilingualTranscript(q){const en={N:'Narrator',M:'Male',F:'Female'},zh={N:'旁白',M:'男聲',F:'女聲'};return `<div class="bilingual-transcript">${q.transcript.map((line,i)=>`<div class="transcript-pair"><p class="transcript-en" lang="en"><b>${en[line.speaker]}:</b> ${esc(line.text)}</p><p class="transcript-zh" lang="zh-TW"><b>${zh[q.transcriptZhTW[i].speaker]}：</b> ${esc(q.transcriptZhTW[i].text)}</p></div>`).join('')}</div>`;}
function feedback(i){const q=Q[i];return `<div class="feedback ${correct(i)?'':'bad'}"><h3>${correct(i)?'✓ 答對了':'再聽一次，留意關鍵線索'} · 正解 ${q.correctOptionId}</h3><p>${esc(q.explanationZhTW)}</p><details><summary>查看英文逐字稿與逐句中文翻譯</summary>${bilingualTranscript(q)}</details></div>`;}
function togglePlay(){if(running){stop();toast('已停止播放。');return;}playQuestion();}
function updatePlayback(text){if(!state||screen!=='question')return;const n=state.plays[state.index],exam=state.mode==='exam',b=$('#playBtn');if(!b)return;b.textContent=running?'■':'▶';b.disabled=!running&&exam&&n>=2;b.setAttribute('aria-label',running?'停止播放與自動換題':exam&&n>=2?'本題已達播放上限':'播放本題');$('#wave').classList.toggle('active',running&&!audio.paused);$('#playCount').textContent=exam?`已用 ${n} / 2 次`:'可不限次重聽 · 每輪兩次';$('#audioStatus').textContent=text||(running?'正在聆聽…':exam&&n>=2?'已達本題播放上限':'準備好就按下播放');}
function playQuestion(){if(!state||state.finished||screen!=='question')return;const i=state.index,exam=state.mode==='exam';if(exam&&state.plays[i]>=2)return;stop();running=true;const token=runToken;let remaining=exam?2-state.plays[i]:2;audio.src=audioSource(Q[i].audioPath);audio.playbackRate=exam?1:speed;const fail=()=>{if(token!==runToken)return;stop();toast('音檔無法播放，請檢查網路連線，並在瀏覽器允許播放聲音後再試。');};const once=()=>{if(token!==runToken)return;audio.currentTime=0;audio.onended=()=>{if(token!==runToken)return;remaining--;if(remaining>0){updatePlayback('稍候 2 秒，再聽一次…');waitId=setTimeout(once,2000);}else{updatePlayback(exam?'本題播畢，8 秒後前往下一題…':'本輪已播放兩次');if(exam&&i<Q.length-1){autoId=setTimeout(()=>{if(token!==runToken)return;go(i+1);playQuestion();},8000);}else{running=false;updatePlayback(exam?'全卷播畢，可檢查答案後交卷':'本輪已播放兩次，可再重聽');}}};audio.onerror=fail;audio.play().then(()=>{if(token!==runToken)return;state.plays[i]++;updatePlayback(`正在播放 · 本輪第 ${exam?state.plays[i]:3-remaining} / 2 次`);}).catch(fail);};once();updatePlayback();}
audio.ontimeupdate=()=>{if(screen!=='question'||!$('#audioProgress'))return;$('#audioProgress').style.width=(Number.isFinite(audio.duration)?audio.currentTime/audio.duration*100:0)+'%';$('#audioTime').textContent=time(audio.currentTime);};
function time(s){s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function updateClock(){if(!state||state.finished)return;if(state.deadline&&Date.now()>=state.deadline){submit(true);return;}if(!$('#clock'))return;const sec=state.deadline?(state.deadline-Date.now())/1000:(Date.now()-state.started)/1000;$('#clock').textContent=(state.deadline?'剩餘 ':'已用 ')+time(sec);$('#clock').classList.toggle('urgent',!!state.deadline&&sec<180);}
setInterval(updateClock,1000);
function confirmSubmit(){stop();const missing=21-answered();ask('交卷並查看成績？',missing?`還有 ${missing} 題未作答，未作答題目將以 0 分計算。交卷後可查看所有解析。`:'21 題都已完成，交卷後可查看成績、逐字稿與解析。',()=>submit(false),'交卷計分');}
function submit(timeout){if($('#imageViewer').open)$('#imageViewer').close();stop();if(!state||state.finished)return;state.finished=true;state.finishedAt=state.deadline&&timeout?state.deadline:Date.now();screen='results';filter='all';render();window.scrollTo(0,0);if(timeout)toast('25 分鐘已到，已自動交卷。');}
function reviewOptions(q){if(q.type==='image-choice')return `<div class="review-images">${q.options.map(o=>`<figure><img src="${esc(imageSource(o.imagePath))}" alt="${esc(o.imageAlt)}"><figcaption>${o.id}${o.id===q.correctOptionId?' ✓':''}</figcaption></figure>`).join('')}</div>`;return `<div class="review-options" lang="en">${q.options.map(o=>`<div class="${o.id===q.correctOptionId?'correct':''}">${o.id}. ${esc(o.text)} ${o.id===q.correctOptionId?'✓':''}</div>`).join('')}</div>`;}
function renderResults(){const score=Q.filter((q,i)=>correct(i)).length,wrong=21-score,seconds=((state.finishedAt||Date.now())-state.started)/1000;$('#app').innerHTML=`<div class="wrap"><div class="topline"><div><div class="eyebrow">YOUR LISTENING REPORT</div><h2 style="margin:5px 0 0">每一次練習，都有收穫。</h2></div><span class="screen-label">${state.mode==='exam'?'模擬測驗':'自主練習'} · 用時 ${time(seconds)}</span></div><section class="score-hero"><div class="score-ring"><strong>${score}</strong><small>/ 21 分</small></div><div><div class="eyebrow" style="color:#b5cfbf">ACCURACY ${Math.round(score/21*100)}%</div><h2>${score>=18?'聽得仔細，繼續保持。':score>=12?'掌握線索，再往前一步。':'重聽關鍵句，慢慢建立把握。'}</h2><p>答對 ${score} 題 · 答錯 ${answered()-score} 題 · 未作答 ${21-answered()} 題<br>此為練習原始分數，不換算官方會考等級。</p></div></section><div class="result-stats">${BANK.sections.map(s=>{const indexes=Q.map((q,i)=>q.sectionId===s.id?i:-1).filter(i=>i>=0);return `<div class="stat">${s.name}<strong>${indexes.filter(correct).length} <span class="screen-label">/ ${indexes.length} 題</span></strong></div>`;}).join('')}</div><div class="actions" style="margin-bottom:32px"><button class="btn" onclick="retryWrong()" ${!wrong?'disabled':''}>練習錯題與未答題 (${wrong})</button><button class="btn secondary" onclick="restart()">重新測驗</button><button class="btn secondary" onclick="exportResults()">匯出作答 JSON</button><button class="btn quiet" onclick="printReport()">列印解析</button></div><div class="topline"><h2 style="font-size:21px;margin:0">逐題回顧</h2><div class="actions"><button class="filter ${filter==='all'?'on':''}" onclick="setFilter('all')">全部 21 題</button><button class="filter ${filter==='wrong'?'on':''}" onclick="setFilter('wrong')">錯題與未答 ${wrong}</button></div></div><div>${Q.map((q,i)=>{if(filter==='wrong'&&correct(i))return '';return `<article class="review-card"><h3><span>第 ${q.number} 題 <span class="screen-label">· ${esc(q.skillTags.join('、'))}</span></span><span class="review-status ${correct(i)?'':'bad'}">${correct(i)?'✓ 答對':state.answers[i]?'✕ 答錯':'— 未作答'}</span></h3><p class="answerline">你的答案：${state.answers[i]||'未作答'}　正確答案：${q.correctOptionId}</p>${reviewOptions(q)}<p style="font-size:14px;margin-bottom:12px">${esc(q.explanationZhTW)}</p><button class="btn secondary" style="padding:6px 12px;font-size:12px" onclick="reviewListen(${i})">▶ 重聽本題</button><details><summary style="font-size:13px">英文逐字稿與逐句中文翻譯</summary>${bilingualTranscript(q)}</details></article>`;}).join('')||'<div class="empty">全部答對了，沒有錯題！</div>'}</div><p class="notice">重聽時，先找出自己漏聽的字，再用逐字稿確認。語音、圖片與選項均為原創練習素材。</p></div>`;}
function setFilter(v){stop();filter=v;renderResults();}
function reviewListen(i){stop();audio.src=audioSource(Q[i].audioPath);audio.playbackRate=speed;audio.play().catch(()=>toast('音檔無法播放，請檢查網路連線後再試。'));}
function restart(){ask('重新作答整份試卷？','目前顯示的成績將由新紀錄取代。可以先匯出作答 JSON 保存這次結果。',()=>{state=null;begin('exam');},'重新測驗');}
function retryWrong(){const ids=Q.map((q,i)=>correct(i)?-1:i).filter(i=>i>=0);if(!ids.length)return;ask('開始訂正錯題？','將進入自主練習模式，保留答對題的答案，清空錯題與未答題；可先匯出目前成績。',()=>{stop();state=blank('practice');Q.forEach((q,i)=>{if(!ids.includes(i))state.answers[i]=q.correctOptionId;});state.index=ids[0];state.flags=ids;screen='question';render();window.scrollTo(0,0);},'開始訂正');}
function exportResults(){const data={schemaVersion:'1.0.0',bankId:BANK.bankId,audioRevision:BANK.audio.revision||'original-v1',mode:state.mode,startedAt:new Date(state.started).toISOString(),submittedAt:new Date(state.finishedAt).toISOString(),score:Q.filter((q,i)=>correct(i)).length,maxScore:21,answers:Q.map((q,i)=>({questionId:q.id,selectedOptionId:state.answers[i],correctOptionId:q.correctOptionId,isCorrect:correct(i),playCount:state.plays[i]}))};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='listening-results-'+new Date(state.finishedAt).toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function printReport(){stop();filter='all';renderResults();document.querySelectorAll('.review-card details').forEach(d=>d.open=true);window.print();}
$('#imageViewer').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();openImage(zoomQuestion,'ABC'[('ABC'.indexOf(zoomOption)+(e.key==='ArrowRight'?1:2))%3]);}});
// Every page entry starts a fresh exam, including back/forward cache restores.
function resetExam(){
 stop();
 audio.removeAttribute('src');audio.load();
 for(const id of ['modal','imageViewer'])if($('#'+id).open)$('#'+id).close();
 clearTimeout(toastId);$('#toast').hidden=true;
 state=blank('exam');screen='question';filter='all';speed=1;audio.playbackRate=1;
 render();window.scrollTo(0,0);
}
resetExam();
window.addEventListener('pageshow',event=>{if(event.persisted)resetExam();});
</script>
<script>
// Isolated Blogger embed support; no answers or other student data are sent to the parent page.
(function(){
  if(window.parent===window||new URLSearchParams(location.search).get('embed')!=='blogger')return;
  const bankId='cap-listening-gept-elem-02';
  let parentOrigin='*',queued=false,lastHeight=0,lastPosition=screen+':'+state.index;
  function send(type,extra){window.parent.postMessage(Object.assign({type,bankId},extra||{}),parentOrigin);}
  function measure(force){
    const height=Math.ceil(document.body.getBoundingClientRect().height)+2;
    if(force||height!==lastHeight){lastHeight=height;send('listening-exam:height',{height});}
  }
  function schedule(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;measure(false);});}
  const originalOpenImage=openImage;
  openImage=function(){originalOpenImage.apply(this,arguments);send('listening-exam:navigate');};
  const originalAsk=ask;
  ask=function(){originalAsk.apply(this,arguments);send('listening-exam:navigate');};
  const originalRender=render;
  render=function(){
    originalRender();
    const position=screen+':'+state.index;
    if(position!==lastPosition){lastPosition=position;send('listening-exam:navigate');}
    schedule();
  };
  addEventListener('message',event=>{
    if(event.source!==window.parent||!event.data||event.data.type!=='listening-exam:measure'||event.data.bankId!==bankId)return;
    if(event.origin!=='null')parentOrigin=event.origin;
    measure(true);
  });
  if(window.ResizeObserver)new ResizeObserver(schedule).observe(document.body);
  else new MutationObserver(schedule).observe(document.getElementById('app'),{childList:true,subtree:true});
  addEventListener('resize',schedule);
  document.addEventListener('load',schedule,true);
  measure(true);
})();
</script>
<style id="blogger-narrow-layout">
.blogger-embed header,.blogger-embed footer{display:none}
@media(max-width:650px){.nav-grid{grid-template-columns:repeat(8,minmax(0,1fr))}.nav-q{min-width:0;padding:0}.audio-bottom{flex-wrap:wrap;row-gap:6px}}
@media(max-width:420px){header{height:auto;min-height:68px;padding-top:14px;padding-bottom:14px;gap:10px;flex-wrap:wrap}.topline{flex-wrap:wrap;gap:14px}.topline>.actions{margin-left:auto}}
</style>
<script>
if(window.parent!==window&&new URLSearchParams(location.search).get('embed')==='blogger')document.documentElement.classList.add('blogger-embed');
</script>
