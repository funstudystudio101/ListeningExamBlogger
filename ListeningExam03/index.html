 "text": "每個三十元，但今天有特賣：買二送一。"}, {"speaker": "F", "text": "聽起來太棒了！請給我六個蘋果派。"}, {"speaker": "M", "text": "沒問題。總共是一百二十元。"}, {"speaker": "N", "text": "問題：這位女士買六個蘋果派需要付多少錢？"}], "translationZhTW": "女：下午好。請問這些蘋果派多少錢？\n男：每個三十元，但今天有特賣：買二送一。\n女：聽起來太棒了！請給我六個蘋果派。\n男：沒問題。總共是一百二十元。\n旁白：問題：這位女士買六個蘋果派需要付多少錢？", "options": [{"id": "A", "text": "One hundred and twenty dollars.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "One hundred and fifty dollars.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "One hundred and eighty dollars.", "imagePath": null, "imageAlt": null}], "correctOptionId": "A", "explanationZhTW": "蘋果派每個 30 元，買二送一（每 3 個只需付 2 個的錢＝60 元），買 6 個共需付 120 元，男店員也明確說出總金額，故選 (A)。", "skillTags": ["言談理解・蘋果派特價結帳"], "points": 1, "audioDurationSeconds": 30.6}, {"id": "gept-listening-03-q13", "number": 13, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q13.m4a", "transcript": [{"speaker": "M", "text": "Excuse me, does this train go to Kaohsiung?"}, {"speaker": "F", "text": "No, this is a slow train to Taichung. The fast train to Kaohsiung will arrive at Platform Two in fifteen minutes."}, {"speaker": "M", "text": "Thank you! I almost took the wrong train."}, {"speaker": "F", "text": "You are welcome. Don't forget your ticket and bag."}, {"speaker": "N", "text": "Question: What should the man do next?"}], "transcriptZhTW": [{"speaker": "M", "text": "不好意思，請問這班火車有到高雄嗎？"}, {"speaker": "F", "text": "沒有，這是開往台中的慢車。開往高雄的快車十五分鐘後會在第二月台進站。"}, {"speaker": "M", "text": "噢，謝謝妳！我差點搭錯車了。"}, {"speaker": "F", "text": "不客氣。別忘了您的車票和提袋。"}, {"speaker": "N", "text": "問題：這位男子接下來應該怎麼做？"}], "translationZhTW": "男：不好意思，請問這班火車有到高雄嗎？\n女：沒有，這是開往台中的慢車。開往高雄的快車十五分鐘後會在第二月台進站。\n男：噢，謝謝妳！我差點搭錯車了。\n女：不客氣。別忘了您的車票和提袋。\n旁白：問題：這位男子接下來應該怎麼做？", "options": [{"id": "A", "text": "Get on the slow train right now.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "Go to Platform Two and wait for the fast train.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "Buy another ticket at the station door.", "imagePath": null, "imageAlt": null}], "correctOptionId": "B", "explanationZhTW": "男子搭錯車前詢問往高雄的班車，女職員告知往高雄的快車 15 分鐘後會在第二月台進站，男子應前往第二月台候車，故選 (B)。", "skillTags": ["言談理解・車站詢問高雄列車"], "points": 1, "audioDurationSeconds": 29.7}, {"id": "gept-listening-03-q14", "number": 14, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q14.m4a", "transcript": [{"speaker": "M", "text": "Are you joining the school basketball club this term?"}, {"speaker": "F", "text": "I wanted to, but they practice every Tuesday and Thursday afternoon, and I have piano lessons then."}, {"speaker": "M", "text": "What about the badminton club? They only practice on Wednesday afternoon."}, {"speaker": "F", "text": "That is great! Wednesday afternoon is free for me. Let's join together."}, {"speaker": "N", "text": "Question: Which club will the girl join?"}], "transcriptZhTW": [{"speaker": "M", "text": "妳這學期要參加學校的籃球社嗎？"}, {"speaker": "F", "text": "我本來想，但他們每週二和週四下午練習，那時我有鋼琴課。"}, {"speaker": "M", "text": "那羽球社呢？他們只有週三下午練習。"}, {"speaker": "F", "text": "那太好了！我週三下午正好有空。我們一起加入吧。"}, {"speaker": "N", "text": "問題：這名女孩將會加入哪一個社團？"}], "translationZhTW": "男：妳這學期要參加學校的籃球社嗎？\n女：我本來想，但他們每週二和週四下午練習，那時我有鋼琴課。\n男：那羽球社呢？他們只有週三下午練習。\n女：那太好了！我週三下午正好有空。我們一起加入吧。\n旁白：問題：這名女孩將會加入哪一個社團？", "options": [{"id": "A", "text": "The basketball club.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "The piano club.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "The badminton club.", "imagePath": null, "imageAlt": null}], "correctOptionId": "C", "explanationZhTW": "女孩週二和週四下午要上鋼琴課，無法參加籃球隊；羽球隊只有週三下午練習，女孩那時有空，因此決定加入羽球社，故選 (C)。", "skillTags": ["言談理解・課後社團選擇"], "points": 1, "audioDurationSeconds": 32.3}, {"id": "gept-listening-03-q15", "number": 15, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q15.m4a", "transcript": [{"speaker": "M", "text": "Good morning. What is the matter with you today?"}, {"speaker": "F", "text": "I have had a bad cough and a sore throat since last night."}, {"speaker": "M", "text": "Let me check. Your throat is very red. Here is some medicine. Take it three times a day after meals, drink a lot of warm water, and rest at home."}, {"speaker": "F", "text": "Thank you, doctor. Can I go to school tomorrow?"}, {"speaker": "M", "text": "No, you should stay in bed until you feel better."}, {"speaker": "N", "text": "Question: What did the doctor tell the woman to do?"}], "transcriptZhTW": [{"speaker": "M", "text": "早安。今天身體哪裡不舒服嗎？"}, {"speaker": "F", "text": "從昨晚開始我就一直咳嗽而且喉嚨痛。"}, {"speaker": "M", "text": "我看一下。妳的喉嚨很紅。這是給妳的藥。三餐飯後服用，多喝溫水，留在家裡休息。"}, {"speaker": "F", "text": "謝謝醫生。我明天能去上學嗎？"}, {"speaker": "M", "text": "不行，妳應該多臥床休息直到感覺好一點。"}, {"speaker": "N", "text": "問題：醫生吩咐這位女士做什麼？"}], "translationZhTW": "男：早安。今天身體哪裡不舒服嗎？\n女：從昨晚開始我就一直咳嗽而且喉嚨痛。\n男：我看一下。妳的喉嚨很紅。這是給妳的藥。三餐飯後服用，多喝溫水，留在家裡休息。\n女：謝謝醫生。我明天能去上學嗎？\n男：不行，妳應該多臥床休息直到感覺好一點。\n旁白：問題：醫生吩咐這位女士做什麼？", "options": [{"id": "A", "text": "Take the medicine and stay in bed to rest.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "Go to school early tomorrow morning.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "Drink cold water before sleeping.", "imagePath": null, "imageAlt": null}], "correctOptionId": "A", "explanationZhTW": "醫生檢查後開藥，吩咐一日三餐後服藥、多喝溫水，並建議留在家中臥床休息，故選 (A)。", "skillTags": ["言談理解・看診醫生囑咐"], "points": 1, "audioDurationSeconds": 39.1}, {"id": "gept-listening-03-q16", "number": 16, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q16.m4a", "transcript": [{"speaker": "F", "text": "Did you find everything on our shopping list?"}, {"speaker": "M", "text": "Let me see. We have milk, eggs, bread, and some apples in the basket."}, {"speaker": "F", "text": "Wait, we still need some butter to bake the cake tomorrow."}, {"speaker": "M", "text": "I looked for it near the cheese, but I did not see any."}, {"speaker": "F", "text": "Let's ask the clerk over there for help."}, {"speaker": "N", "text": "Question: What do they still need to buy?"}], "transcriptZhTW": [{"speaker": "F", "text": "我們購物清單上的東西都找齊了嗎？"}, {"speaker": "M", "text": "我看看。籃子裡有牛奶、雞蛋、麵包和幾顆蘋果。"}, {"speaker": "F", "text": "等等，我們明天烤蛋糕還需要一些奶油。"}, {"speaker": "M", "text": "我在乳酪附近找過，但沒看到。"}, {"speaker": "F", "text": "我們去問問那邊的店員幫忙吧。"}, {"speaker": "N", "text": "問題：他們還需要買什麼？"}], "translationZhTW": "女：我們購物清單上的東西都找齊了嗎？\n男：我看看。籃子裡有牛奶、雞蛋、麵包和幾顆蘋果。\n女：等等，我們明天烤蛋糕還需要一些奶油。\n男：我在乳酪附近找過，但沒看到。\n女：我們去問問那邊的店員幫忙吧。\n旁白：問題：他們還需要買什麼？", "options": [{"id": "A", "text": "Milk and bread.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "Some butter for the cake.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "Fresh apples and eggs.", "imagePath": null, "imageAlt": null}], "correctOptionId": "B", "explanationZhTW": "籃子裡已有牛奶、雞蛋、麵包與蘋果，但做蛋糕所需的奶油還沒買到，故選 (B)。", "skillTags": ["言談理解・超市漏買奶油"], "points": 1, "audioDurationSeconds": 30.2}, {"id": "gept-listening-03-q17", "number": 17, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q17.m4a", "transcript": [{"speaker": "N", "text": "Welcome to the City Art Museum. Today we are showing special paintings by young artists from all over Taiwan. Please remember that taking photos is not allowed in any of the rooms. Also, please turn off your cellphones and keep your voice low. If you need any help, our workers at the front desk are happy to help you. Thank you and enjoy your visit."}, {"speaker": "N", "text": "Question: What are visitors asked NOT to do in the museum?"}], "transcriptZhTW": [{"speaker": "N", "text": "歡迎來到市立美術館。今天我們展出全台灣青年藝術家的特別畫作。請注意，所有展覽室內均禁止拍照。同時，請將手機轉為靜音模式並保持輕聲說話。若需要任何協助，我們服務台的同仁很樂意為您服務。謝謝並祝您參觀愉快。"}, {"speaker": "N", "text": "問題：參觀民眾被要求不要在美術館做什麼？"}], "translationZhTW": "旁白：歡迎來到市立美術館。今天我們展出全台灣青年藝術家的特別畫作。請注意，所有展覽室內均禁止拍照。同時，請將手機轉為靜音模式並保持輕聲說話。若需要任何協助，我們服務台的同仁很樂意為您服務。謝謝並祝您參觀愉快。\n旁白：問題：參觀民眾被要求不要在美術館做什麼？", "options": [{"id": "A", "text": "Ask workers at the front desk for help.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "Turn off their cellphones.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "Take photos inside the rooms.", "imagePath": null, "imageAlt": null}], "correctOptionId": "C", "explanationZhTW": "廣播明確提醒參觀民眾「taking photos is not allowed in any of the rooms」（展覽室內禁止拍照），故選 (C)。", "skillTags": ["言談理解・美術館禁止拍照"], "points": 1, "audioDurationSeconds": 33.5}, {"id": "gept-listening-03-q18", "number": 18, "sectionId": "dialogue", "type": "image-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q18.m4a", "transcript": [{"speaker": "F", "text": "Excuse me, sir. I am looking for the bookstore. Where is it?"}, {"speaker": "M", "text": "Walk along Main Street until you see Park Road. Turn right, and the bookstore is right on the corner, across from the hospital."}, {"speaker": "F", "text": "Is it near the city park?"}, {"speaker": "M", "text": "Yes, the park is right behind the bookstore."}, {"speaker": "N", "text": "Question: Where is the bookstore on the map?"}], "transcriptZhTW": [{"speaker": "F", "text": "不好意思，先生。我在找書店，請問在哪裡？"}, {"speaker": "M", "text": "沿著主街一直走，直到看見公園路。右轉後書店就在轉角處，正好在醫院對面。"}, {"speaker": "F", "text": "它靠近市立公園嗎？"}, {"speaker": "M", "text": "是的，公園就在書店正後方。"}, {"speaker": "N", "text": "問題：地圖上哪一個位置是書店？"}], "translationZhTW": "女：不好意思，先生。我在找書店，請問在哪裡？\n男：沿著主街一直走，直到看見公園路。右轉後書店就在轉角處，正好在醫院對面。\n女：它靠近市立公園嗎？\n男：是的，公園就在書店正後方。\n旁白：問題：地圖上哪一個位置是書店？", "options": [{"id": "A", "text": null, "imagePath": "images/town-map-hospital-sw.svg", "imageAlt": "Town center map highlighting the Hospital"}, {"id": "B", "text": null, "imagePath": "images/town-map-bookstore-se.svg", "imageAlt": "Town center map highlighting the Bookstore"}, {"id": "C", "text": null, "imagePath": "images/town-map-supermarket-ne.svg", "imageAlt": "Town center map highlighting the Supermarket"}], "correctOptionId": "B", "explanationZhTW": "對話指引沿著主街（Main Street）走，在公園路（Park Road）右轉，書店位於街角，且正對著醫院（Hospital），符合圖 (B) 標示的位置；圖 (A) 是醫院，圖 (C) 是超市。", "skillTags": ["言談理解・市中心地圖找書店"], "points": 1, "audioDurationSeconds": 30.2}, {"id": "gept-listening-03-q19", "number": 19, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q19.m4a", "transcript": [{"speaker": "F", "text": "Good morning, teachers and students. Please listen to this notice. The school library will close early this Friday at twelve o'clock. We need to clean the reading rooms and count all the books in the library. You can still return your books in the morning, or drop them into the blue box by the door. The library will open again next Monday at eight o'clock. Thank you for your help."}, {"speaker": "N", "text": "Question: Why will the school library close early this Friday?"}], "transcriptZhTW": [{"speaker": "F", "text": "老師和各位同學早安。請仔細聆聽這則廣播通知。學校圖書館本週五將於十二點提早閉館。我們需要打掃閱覽室並清點書架上的所有書籍。您仍可在上午還書，或投入門旁的藍色還書箱。圖書館將於下週一上午八點重新開放。感謝您的配合。"}, {"speaker": "N", "text": "問題：學校圖書館這週五為何要提早閉館？"}], "translationZhTW": "女：老師和各位同學早安。請仔細聆聽這則廣播通知。學校圖書館本週五將於十二點提早閉館。我們需要打掃閱覽室並清點書架上的所有書籍。您仍可在上午還書，或投入門旁的藍色還書箱。圖書館將於下週一上午八點重新開放。感謝您的配合。\n旁白：問題：學校圖書館這週五為何要提早閉館？", "options": [{"id": "A", "text": "To clean the rooms and count the books.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "Because of bad and rainy weather.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "To welcome new teachers and students.", "imagePath": null, "imageAlt": null}], "correctOptionId": "A", "explanationZhTW": "廣播宣布本週五圖書館將在中午十二點提早閉館，原因是「clean the reading rooms and count all the books on the shelves」（清掃閱覽室並清點書架藏書），故選 (A)。", "skillTags": ["言談理解・圖書館提前閉館"], "points": 1, "audioDurationSeconds": 35.0}, {"id": "gept-listening-03-q20", "number": 20, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q20.m4a", "transcript": [{"speaker": "M", "text": "Here is the weekend weather report for southern Taiwan. Saturday will be sunny and warm, with temperatures around twenty eight degrees. It will be a wonderful day for playing sports in the park or going to the beach. However, on Sunday afternoon, a cold wind will arrive from the north, bringing cloudy skies and heavy rain. If you plan to go out on Sunday, remember to wear a warm jacket and take an umbrella with you."}, {"speaker": "N", "text": "Question: What will the weather be like on Sunday afternoon?"}], "transcriptZhTW": [{"speaker": "M", "text": "以下是南台灣週末天氣預報。週六天氣晴朗溫暖，氣溫大約二十八度。將會是在公園運動或去海灘玩的絕佳日子。然而週日下午，來自北方的冷風將抵達，帶來陰沉的天空與大雨。如果您計畫週日出門，請記得穿上保暖夾克並攜帶雨傘。"}, {"speaker": "N", "text": "問題：週日下午的天氣會是如何？"}], "translationZhTW": "男：以下是南台灣週末天氣預報。週六天氣晴朗溫暖，氣溫大約二十八度。將會是在公園運動或去海灘玩的絕佳日子。然而週日下午，來自北方的冷風將抵達，帶來陰沉的天空與大雨。如果您計畫週日出門，請記得穿上保暖夾克並攜帶雨傘。\n旁白：問題：週日下午的天氣會是如何？", "options": [{"id": "A", "text": "Sunny and warm all day.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "Hot with no wind at all.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "Cloudy and rainy with cold wind.", "imagePath": null, "imageAlt": null}], "correctOptionId": "C", "explanationZhTW": "氣象播報指出週日下午北方冷空氣南下，將帶來陰天、大雨與冷風（cloudy skies and heavy rain, cold wind），故選 (C)。", "skillTags": ["言談理解・週末天氣預報"], "points": 1, "audioDurationSeconds": 34.7}, {"id": "gept-listening-03-q21", "number": 21, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q21.m4a", "transcript": [{"speaker": "M", "text": "Hello, City Bus Lost and Found. May I help you?"}, {"speaker": "F", "text": "Yes, please. I think I left my dark blue jacket on Bus Twelve this afternoon around three o'clock."}, {"speaker": "M", "text": "Is there anything inside the pockets of your jacket?"}, {"speaker": "F", "text": "Yes, there is a yellow student card and a pair of white gloves in the left pocket."}, {"speaker": "M", "text": "Let me check our office... Yes, the driver brought it here twenty minutes ago. You can come pick it up before eight tonight."}, {"speaker": "F", "text": "Thank you so much! I will come right now."}, {"speaker": "N", "text": "Question: What was inside the woman's blue jacket?"}], "transcriptZhTW": [{"speaker": "M", "text": "您好，市公車失物招領處，很高興為您服務。"}, {"speaker": "F", "text": "是的，我想我今天下午三點左右把深藍色夾克忘在 12 路公車上了。"}, {"speaker": "M", "text": "您的夾克口袋裡面有放任何東西嗎？"}, {"speaker": "F", "text": "有的，左邊口袋裡有一張黃色學生證和一副白色手套。"}, {"speaker": "M", "text": "我幫您查詢辦公室……是的，司機二十分鐘前送過來了。您可以在今晚八點前來領取。"}, {"speaker": "F", "text": "太感謝你了！我現在就過去。"}, {"speaker": "N", "text": "問題：這位女士的藍色夾克裡面裝了什麼？"}], "translationZhTW": "男：您好，市公車失物招領處，很高興為您服務。\n女：是的，我想我今天下午三點左右把深藍色夾克忘在 12 路公車上了。\n男：您的夾克口袋裡面有放任何東西嗎？\n女：有的，左邊口袋裡有一張黃色學生證和一副白色手套。\n男：我幫您查詢辦公室……是的，司機二十分鐘前送過來了。您可以在今晚八點前來領取。\n女：太感謝你了！我現在就過去。\n旁白：問題：這位女士的藍色夾克裡面裝了什麼？", "options": [{"id": "A", "text": "Some money and a watch.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "A yellow student card and white gloves.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "A train ticket and a small notebook.", "imagePath": null, "imageAlt": null}], "correctOptionId": "B", "explanationZhTW": "女子致電公車失物招領處詢問遺失的藍色夾克，並說明左側口袋內裝有「yellow student card and a pair of white gloves」（黃色學生證與一雙白手套），故選 (B)。", "skillTags": ["言談理解・公車遺失物招領"], "points": 1, "audioDurationSeconds": 47.4}]}</script>
<script>
'use strict';
const BANK=JSON.parse(document.getElementById('bank-data').textContent),Q=BANK.questions,$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function audioSource(path){return path+'?v='+encodeURIComponent(BANK.audio.revision||'original-v1');}
const audio=$('#player');let state=null,screen='question',filter='all',speed=1,running=false,runToken=0,waitId=null,autoId=null,toastId=null;
function blank(mode){return{version:1,bankId:BANK.bankId,mode,index:0,answers:Array(Q.length).fill(null),plays:Array(Q.length).fill(0),flags:[],checked:[],started:Date.now(),deadline:mode==='exam'?Date.now()+1500000:null,finished:false,finishedAt:null};}
function toast(t){clearTimeout(toastId);$('#toast').textContent=t;$('#toast').hidden=false;toastId=setTimeout(()=>$('#toast').hidden=true,4500);}
function ask(title,body,callback,label='確定'){const d=$('#modal');$('#modalTitle').textContent=title;$('#modalBody').textContent=body;$('#modalConfirm').textContent=label;$('#modalConfirm').onclick=()=>{d.close();callback();};$('#modalCancel').onclick=()=>d.close();d.showModal();}
function stop(){runToken++;clearTimeout(waitId);clearTimeout(autoId);audio.pause();audio.onended=null;audio.onerror=null;running=false;updatePlayback();}
function begin(mode){const act=()=>{stop();state=blank(mode);speed=1;screen='question';render();window.scrollTo(0,0);};if(state&&!state.finished)ask('開始新的練習？','目前未交卷的作答紀錄將被新的練習取代。',act,'開始新練習');else act();}
function answered(){return state.answers.filter(Boolean).length;}
function correct(i){return state.answers[i]===Q[i].correctOptionId;}
function render(){if(screen==='question')renderQuestion();else renderResults();updateClock();}
function navSection(s){return `<section class="nav-section"><div class="side-title">${esc(s.name)} <span style="float:right">${s.start}–${s.end}</span></div><div class="nav-grid">${Q.filter(q=>q.sectionId===s.id).map(q=>{const i=q.number-1;return `<button class="nav-q ${state.answers[i]?'answered':''} ${state.index===i?'current':''} ${state.flags.includes(i)?'flagged':''}" aria-label="第 ${q.number} 題${state.answers[i]?'，已作答':''}${state.flags.includes(i)?'，待複習':''}" ${state.index===i?'aria-current="step"':''} onclick="go(${i})">${q.number}</button>`;}).join('')}</div></section>`;}
function renderQuestion(){const i=state.index,q=Q[i],section=BANK.sections.find(s=>s.id===q.sectionId),image=q.type==='image-choice';$('#app').innerHTML=`<div class="wrap"><div class="topline"><div><div class="eyebrow">GEPT ELEMENTARY PRACTICE 03</div><h2 style="margin:5px 0 0">${state.mode==='exam'?'模擬測驗':'自主練習'}</h2></div><div class="actions"><span class="timer" id="clock"></span><button class="btn secondary" onclick="confirmSubmit()">交卷計分</button></div></div><div class="workspace"><main><div class="status-line"><span>已作答 <b>${answered()}</b> / 21 題</span><div class="overall-track"><span style="width:${answered()/21*100}%"></span></div><span>${esc(section.name)}</span></div><article class="question-panel"><div class="q-head"><span class="q-number">QUESTION ${String(q.number).padStart(2,'0')} <span style="color:#b0bbb3">/ 21</span></span><button class="flag-btn ${state.flags.includes(i)?'on':''}" aria-pressed="${state.flags.includes(i)}" onclick="flag()">⚑ ${state.flags.includes(i)?'已標記':'稍後複習'}</button></div><h3 class="instruction">${esc(q.instruction)}</h3><div class="audio-panel"><div class="audio-row"><button class="play" id="playBtn" onclick="togglePlay()" aria-label="播放本題兩次">▶</button><div class="audio-info"><div class="audio-title" id="audioStatus" role="status" aria-live="polite">準備好就按下播放</div><div class="audio-detail">M4A / AAC · 美式英語 · ${q.number<=11?'聆聽句子':'聆聽內容與問題'} · 每輪播放兩次</div></div><div class="wave" id="wave" aria-hidden="true">${[12,21,14,25,17,10,22,15,25,11,19,14].map(h=>`<i style="height:${h}px"></i>`).join('')}</div></div><div class="progress-track"><div class="progress-fill" id="audioProgress"></div></div><div class="audio-bottom"><span id="playCount"></span>${state.mode==='practice'?`<label>速度 <select id="speed" onchange="setSpeed(this.value)">${[.75,.85,1,1.15,1.25].map(n=>`<option value="${n}" ${n===speed?'selected':''}>${n}×</option>`).join('')}</select></label>`:'<span>固定 1× 語速</span>'}<span id="audioTime">00:00</span></div></div><div class="options ${image?'image-options':''} ${q.number===18?'map-options':''}" role="group" aria-label="第 ${q.number} 題選項">${q.options.map(o=>optionMarkup(q,i,o,image)).join('')}</div>${state.mode==='practice'&&state.checked.includes(i)?feedback(i):''}<div class="q-bottom"><button class="btn secondary" ${i===0?'disabled':''} onclick="go(${i-1})">← 上一題</button>${state.mode==='practice'?'<button class="btn quiet" onclick="check()">對答案</button>':'<span class="hint">交卷後可查看逐字稿與解析</span>'}<button class="btn" onclick="${i===20?'confirmSubmit()':`go(${i+1})`}">${i===20?'交卷計分':'下一題 →'}</button></div></article><div class="save-note">每次重新進入或重新整理頁面，測驗都會重置，請在離開前完成作答。</div></main><aside class="sidebar"><span class="eyebrow">YOUR ANSWER SHEET</span><div class="nav-sections">${BANK.sections.map(navSection).join('')}</div><div class="legend"><span><i class="dot"></i>已作答</span><span><i class="dot orange"></i>待複習</span></div><p class="side-note">${state.mode==='exam'?'點播放後每題連播兩次，播畢 8 秒後自動前進。換題會停止目前語音。':'先抓住關鍵字，再試著理解完整語意。選好答案後，可以對答案或繼續下一題。'}</p></aside></div></div>`;updatePlayback();}
function imageSource(path){return path+'?v='+encodeURIComponent(BANK.illustrations?.revision||'original');}
function optionMarkup(q,i,o,image){
 const choice=`<button class="option ${state.answers[i]===o.id?'selected':''}" aria-pressed="${state.answers[i]===o.id}" onclick="answer('${o.id}')"><span class="letter">${o.id}</span>${image?`<img src="${esc(imageSource(o.imagePath))}" alt="${esc(o.imageAlt)}" width="600" height="440">`:`<span lang="en">${esc(o.text)}</span>`}</button>`;
 return image?`<div class="image-choice">${choice}<button class="image-zoom" onclick="openImage(${i},'${o.id}')" aria-label="放大第 ${q.number} 題選項 ${o.id}">放大圖片 ↗</button></div>`:choice;
}
let zoomQuestion=0,zoomOption='A';
function openImage(i,id){
 const q=Q[i],o=q.options.find(o=>o.id===id);if(!o?.imagePath)return;
 zoomQuestion=i;zoomOption=id;$('#imageViewerTitle').textContent=`第 ${q.number} 題・選項 ${id}`;
 $('#imageViewerImg').src=imageSource(o.imagePath);$('#imageViewerImg').alt=o.imageAlt;
 $('#imageViewerTabs').innerHTML=q.options.map(x=>`<button class="filter ${x.id===id?'on':''}" aria-pressed="${x.id===id}" onclick="openImage(${i},'${x.id}')">圖片 ${x.id}</button>`).join('');
 if(!$('#imageViewer').open)$('#imageViewer').showModal();
}

function answer(id){state.answers[state.index]=id;const y=window.scrollY;render();window.scrollTo(0,y);}
function flag(){const i=state.index;state.flags=state.flags.includes(i)?state.flags.filter(x=>x!==i):[...state.flags,i];render();}
function go(i){if(i<0||i>=Q.length)return;if($('#imageViewer').open)$('#imageViewer').close();stop();state.index=i;render();window.scrollTo({top:0,behavior:'auto'});}
function setSpeed(v){speed=Number(v);audio.playbackRate=speed;}
function check(){if(!state.answers[state.index]){toast('請先選擇一個答案。');return;}if(!state.checked.includes(state.index))state.checked.push(state.index);render();}
function bilingualTranscript(q){const en={N:'Narrator',M:'Male',F:'Female'},zh={N:'旁白',M:'男聲',F:'女聲'};return `<div class="bilingual-transcript">${q.transcript.map((line,i)=>`<div class="transcript-pair"><p class="transcript-en" lang="en"><b>${en[line.speaker]}:</b> ${esc(line.text)}</p><p class="transcript-zh" lang="zh-TW"><b>${zh[q.transcriptZhTW[i].speaker]}：</b> ${esc(q.transcriptZhTW[i].text)}</p></div>`).join('')}</div>`;}
function feedback(i){const q=Q[i];return `<div class="feedback ${correct(i)?'':'bad'}"><h3>${correct(i)?'✓ 答對了':'再聽一次，留意關鍵線索'} · 正解 ${q.correctOptionId}</h3><p>${esc(q.explanationZhTW)}</p><details><summary>查看英文逐字稿與逐句中文翻譯</summary>${bilingualTranscript(q)}</details></div>`;}
function togglePlay(){if(running){stop();toast('已停止播放。');return;}playQuestion();}
function updatePlayback(text){if(!state||screen!=='question')return;const n=state.plays[state.index],exam=state.mode==='exam',b=$('#playBtn');if(!b)return;b.textContent=running?'■':'▶';b.disabled=!running&&exam&&n>=2;b.setAttribute('aria-label',running?'停止播放與自動換題':exam&&n>=2?'本題已達播放上限':'播放本題');$('#wave').classList.toggle('active',running&&!audio.paused);$('#playCount').textContent=exam?`已用 ${n} / 2 次`:'可不限次重聽 · 每輪兩次';$('#audioStatus').textContent=text||(running?'正在聆聽…':exam&&n>=2?'已達本題播放上限':'準備好就按下播放');}
function playQuestion(){if(!state||state.finished||screen!=='question')return;const i=state.index,exam=state.mode==='exam';if(exam&&state.plays[i]>=2)return;stop();running=true;const token=runToken;let remaining=exam?2-state.plays[i]:2;audio.src=audioSource(Q[i].audioPath);audio.playbackRate=exam?1:speed;const fail=()=>{if(token!==runToken)return;stop();toast('音檔無法播放，請檢查網路連線，並在瀏覽器允許播放聲音後再試。');};const once=()=>{if(token!==runToken)return;audio.currentTime=0;audio.onended=()=>{if(token!==runToken)return;remaining--;if(remaining>0){updatePlayback('稍候 2 秒，再聽一次…');waitId=setTimeout(once,2000);}else{updatePlayback(exam?'本題播畢，8 秒後前往下一題…':'本輪已播放兩次');if(exam&&i<Q.length-1){autoId=setTimeout(()=>{if(token!==runToken)return;go(i+1);playQuestion();},8000);}else{running=false;updatePlayback(exam?'全卷播畢，可檢查答案後交卷':'本輪已播放兩次，可再重聽');}}};audio.onerror=fail;audio.play().then(()=>{if(token!==runToken)return;state.plays[i]++;updatePlayback(`正在播放 · 本輪第 ${exam?state.plays[i]:3-remaining} / 2 次`);}).catch(fail);};once();updatePlayback();}
audio.ontimeupdate=()=>{if(screen!=='question'||!$('#audioProgress'))return;$('#audioProgress').style.width=(Number.isFinite(audio.duration)?audio.currentTime/audio.duration*100:0)+'%';$('#audioTime').textContent=time(audio.currentTime);};
function time(s){s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function updateClock(){if(!state||state.finished)return;if(state.deadline&&Date.now()>=state.deadline){submit(true);return;}if(!$('#clock'))return;const sec=state.deadline?(state.deadline-Date.now())/1000:(Date.now()-state.started)/1000;$('#clock').textContent=(state.deadline?'剩餘 ':'已用 ')+time(sec);$('#clock').classList.toggle('urgent',!!state.deadline&&sec<180);}
setInterval(updateClock,1000);
function confirmSubmit(){stop();const missing=21-answered();ask('交卷並查看成績？',missing?`還有 ${missing} 題未作答，未作答題目將以 0 分計算。交卷後可查看所有解析。`:'21 題都已完成，交卷後可查看成績、逐字稿與解析。',()=>submit(false),'交卷計分');}
function submit(timeout){if($('#imageViewer').open)$('#imageViewer').close();stop();if(!state||state.finished)return;state.finished=true;state.finishedAt=state.deadline&&timeout?state.deadline:Date.now();screen='results';filter='all';render();window.scrollTo(0,0);if(timeout)toast('25 分鐘已到，已自動交卷。');}
function reviewOptions(q){if(q.type==='image-choice')return `<div class="review-images">${q.options.map(o=>`<figure><img src="${esc(imageSource(o.imagePath))}" alt="${esc(o.imageAlt)}"><figcaption>${o.id}${o.id===q.correctOptionId?' ✓':''}</figcaption></figure>`).join('')}</div>`;return `<div class="review-options" lang="en">${q.options.map(o=>`<div class="${o.id===q.correctOptionId?'correct':''}">${o.id}. ${esc(o.text)} ${o.id===q.correctOptionId?'✓':''}</div>`).join('')}</div>`;}
function renderResults(){const score=Q.filter((q,i)=>correct(i)).length,wrong=21-score,seconds=((state.finishedAt||Date.now())-state.started)/1000;$('#app').innerHTML=`<div class="wrap"><div class="topline"><div><div class="eyebrow">YOUR LISTENING REPORT</div><h2 style="margin:5px 0 0">每一次練習，都有收穫。</h2></div><span class="screen-label">${state.mode==='exam'?'模擬測驗':'自主練習'} · 用時 ${time(seconds)}</span></div><section class="score-hero"><div class="score-ring"><strong>${score}</strong><small>/ 21 分</small></div><div><div class="eyebrow" style="color:#b5cfbf">ACCURACY ${Math.round(score/21*100)}%</div><h2>${score>=18?'聽得仔細，繼續保持。':score>=12?'掌握線索，再往前一步。':'重聽關鍵句，慢慢建立把握。'}</h2><p>答對 ${score} 題 · 答錯 ${answered()-score} 題 · 未作答 ${21-answered()} 題<br>此為練習原始分數，不換算官方會考等級。</p></div></section><div class="result-stats">${BANK.sections.map(s=>{const indexes=Q.map((q,i)=>q.sectionId===s.id?i:-1).filter(i=>i>=0);return `<div class="stat">${s.name}<strong>${indexes.filter(correct).length} <span class="screen-label">/ ${indexes.length} 題</span></strong></div>`;}).join('')}</div><div class="actions" style="margin-bottom:32px"><button class="btn" onclick="retryWrong()" ${!wrong?'disabled':''}>練習錯題與未答題 (${wrong})</button><button class="btn secondary" onclick="restart()">重新測驗</button><button class="btn secondary" onclick="exportResults()">匯出作答 JSON</button><button class="btn quiet" onclick="printReport()">列印解析</button></div><div class="topline"><h2 style="font-size:21px;margin:0">逐題回顧</h2><div class="actions"><button class="filter ${filter==='all'?'on':''}" onclick="setFilter('all')">全部 21 題</button><button class="filter ${filter==='wrong'?'on':''}" onclick="setFilter('wrong')">錯題與未答 ${wrong}</button></div></div><div>${Q.map((q,i)=>{if(filter==='wrong'&&correct(i))return '';return `<article class="review-card"><h3><span>第 ${q.number} 題 <span class="screen-label">· ${esc(q.skillTags.join('、'))}</span></span><span class="review-status ${correct(i)?'':'bad'}">${correct(i)?'✓ 答對':state.answers[i]?'✕ 答錯':'— 未作答'}</span></h3><p class="answerline">你的答案：${state.answers[i]||'未作答'}　正確答案：${q.correctOptionId}</p>${reviewOptions(q)}<p style="font-size:14px;margin-bottom:12px">${esc(q.explanationZhTW)}</p><button class="btn secondary" style="padding:6px 12px;font-size:12px" onclick="reviewListen(${i})">▶ 重聽本題</button><details><summary style="font-size:13px">英文逐字稿與逐句中文翻譯</summary>${bilingualTranscript(q)}</details></article>`;}).join('')||'<div class="empty">全部答對了，沒有錯題！</div>'}</div><p class="notice">重聽時，先找出自己漏聽的字，再用逐字稿確認。語音、圖片與選項均為原創練習素材。</p></div>`;}
function setFilter(v){stop();filter=v;renderResults();}
function reviewListen(i){stop();audio.src=audioSource(Q[i].audioPath);audio.playbackRate=speed;audio.play().catch(()=>toast('音檔無法播放，請檢查網路連線後再試。'));}
function restart(){ask('重新作答整份試卷？','目前顯示的成績將由新紀錄取代。可以先匯出作答 JSON 保存這次結果。',()=>{state=null;begin('exam');},'重新測驗');}
function retryWrong(){const ids=Q.map((q,i)=>correct(i)?-1:i).filter(i=>i>=0);if(!ids.length)return;ask('開始訂正錯題？','將進入自主練習模式，保留答對題的答案，清空錯題與未答題；可先匯出目前成績。',()=>{stop();state=blank('practice');Q.forEach((q,i)=>{if(!ids.includes(i))state.answers[i]=q.correctOptionId;});state.index=ids[0];state.flags=ids;screen='question';render();window.scrollTo(0,0);},'開始訂正');}
function exportResults(){const data={schemaVersion:'1.0.0',bankId:BANK.bankId,audioRevision:BANK.audio.revision||'original-v1',mode:state.mode,startedAt:new Date(state.started).toISOString(),submittedAt:new Date(state.finishedAt).toISOString(),score:Q.filter((q,i)=>correct(i)).length,maxScore:21,answers:Q.map((q,i)=>({questionId:q.id,selectedOptionId:state.answers[i],correctOptionId:q.correctOptionId,isCorrect:correct(i),playCount:state.plays[i]}))};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='listening-results-'+new Date(state.finishedAt).toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function printReport(){stop();filter='all';renderResults();document.querySelectorAll('.review-card details').forEach(d=>d.open=true);window.print();}
$('#imageViewer').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();openImage(zoomQuestion,'ABC'[('ABC'.indexOf(zoomOption)+(e.key==='ArrowRight'?1:2))%3]);}});
// Every page entry starts a fresh exam, including back/forward cache restores.
function resetExam(){
 stop();
 audio.removeAttribute('src');audio.load();
 for(const id of ['modal','imageViewer'])if($('#'+id).open)$('#'+id).close();
 clearTimeout(toastId);$('#toast').hidden=true;
 state=blank('exam');screen='question';filter='all';speed=1;audio.playbackRate=1;
 render();window.scrollTo(0,0);
}
resetExam();
window.addEventListener('pageshow',event=>{if(event.persisted)resetExam();});
</script>
<script>
// Isolated Blogger embed support; no answers or other student data are sent to the parent page.
(function(){
  if(window.parent===window||new URLSearchParams(location.search).get('embed')!=='blogger')return;
  const bankId='cap-listening-gept-elem-03';
  let parentOrigin='*',queued=false,lastHeight=0,lastPosition=screen+':'+state.index;
  function send(type,extra){window.parent.postMessage(Object.assign({type,bankId},extra||{}),parentOrigin);}
  function measure(force){
    const height=Math.ceil(document.body.getBoundingClientRect().height)+2;
    if(force||height!==lastHeight){lastHeight=height;send('listening-exam:height',{height});}
  }
  function schedule(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;measure(false);});}
  const originalOpenImage=openImage;
  openImage=function(){originalOpenImage.apply(this,arguments);send('listening-exam:navigate');};
  const originalAsk=ask;
  ask=function(){originalAsk.apply(this,arguments);send('listening-exam:navigate');};
  const originalRender=render;
  render=function(){
    originalRender();
    const position=screen+':'+state.index;
    if(position!==lastPosition){lastPosition=position;send('listening-exam:navigate');}
    schedule();
  };
  addEventListener('message',event=>{
    if(event.source!==window.parent||!event.data||event.data.type!=='listening-exam:measure'||event.data.bankId!==bankId)return;
    if(event.origin!=='null')parentOrigin=event.origin;
    measure(true);
  });
  if(window.ResizeObserver)new ResizeObserver(schedule).observe(document.body);
  else new MutationObserver(schedule).observe(document.getElementById('app'),{childList:true,subtree:true});
  addEventListener('resize',schedule);
  document.addEventListener('load',schedule,true);
  measure(true);
})();
</script>
<style id="blogger-narrow-layout">
.blogger-embed header,.blogger-embed footer{display:none}
@media(max-width:650px){.nav-grid{grid-template-columns:repeat(8,minmax(0,1fr))}.nav-q{min-width:0;padding:0}.audio-bottom{flex-wrap:wrap;row-gap:6px}}
@media(max-width:420px){header{height:auto;min-height:68px;padding-top:14px;padding-bottom:14px;gap:10px;flex-wrap:wrap}.topline{flex-wrap:wrap;gap:14px}.topline>.actions{margin-left:auto}}
</style>
<script>
if(window.parent!==window&&new URLSearchParams(location.search).get('embed')==='blogger')document.documentElement.classList.add('blogger-embed');
</script>
