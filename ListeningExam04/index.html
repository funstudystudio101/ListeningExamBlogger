xt": "I would like two pounds of bananas and two apples, please."}, {"speaker": "F", "text": "That will be one hundred dollars in total."}, {"speaker": "M", "text": "Here is two hundred dollars."}, {"speaker": "F", "text": "Thank you. Here is your change of one hundred dollars."}, {"speaker": "N", "text": "Question: How much change will the man get back?"}], "transcriptZhTW": [{"speaker": "M", "text": "下午好。請問今天黃香蕉和紅蘋果怎麼賣？"}, {"speaker": "F", "text": "香蕉一磅二十元，蘋果每顆三十元。"}, {"speaker": "M", "text": "請給我兩磅香蕉和兩顆蘋果。"}, {"speaker": "F", "text": "總共是一百元。"}, {"speaker": "M", "text": "這裡給妳兩百元。"}, {"speaker": "F", "text": "謝謝您。找您一百元零錢。"}, {"speaker": "N", "text": "問題：這位男子會拿到多少找零？"}], "translationZhTW": "男：下午好。請問今天黃香蕉和紅蘋果怎麼賣？\n女：香蕉一磅二十元，蘋果每顆三十元。\n男：請給我兩磅香蕉和兩顆蘋果。\n女：總共是一百元。\n男：這裡給妳兩百元。\n女：謝謝您。找您一百元零錢。\n旁白：問題：這位男子會拿到多少找零？", "options": [{"id": "A", "text": "Fifty dollars.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "One hundred dollars.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "One hundred and fifty dollars.", "imagePath": null, "imageAlt": null}], "correctOptionId": "B", "explanationZhTW": "兩磅香蕉 40 元加上兩顆蘋果 60 元共 100 元，男子付 200 元，找零為 100 元，女店員也明確說出找零金額，故選 (B)。", "skillTags": ["言談理解・水果行香蕉蘋果結帳"], "points": 1, "audioDurationSeconds": 36.8}, {"id": "gept-listening-04-q13", "number": 13, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q13.m4a", "transcript": [{"speaker": "M", "text": "Which movie do you want to watch this weekend?"}, {"speaker": "F", "text": "There is a funny cartoon about animals and an exciting space movie."}, {"speaker": "M", "text": "My brother saw the space movie yesterday and said it was a bit boring."}, {"speaker": "F", "text": "Then let's watch the animal cartoon! It sounds much more interesting."}, {"speaker": "M", "text": "Great. I will book two tickets for Saturday afternoon."}, {"speaker": "N", "text": "Question: Which movie did they decide to watch?"}], "transcriptZhTW": [{"speaker": "M", "text": "這個週末妳想看哪一部電影？"}, {"speaker": "F", "text": "有一部關於動物的搞笑卡通，和一部刺激的太空電影。"}, {"speaker": "M", "text": "我哥哥昨天看了那部太空電影，說有點無聊。"}, {"speaker": "F", "text": "那我們看動物卡通吧！聽起來有趣多了。"}, {"speaker": "M", "text": "太好了。我來訂週六下午的兩張票。"}, {"speaker": "N", "text": "問題：他們決定要看哪一部電影？"}], "translationZhTW": "男：這個週末妳想看哪一部電影？\n女：有一部關於動物的搞笑卡通，和一部刺激的太空電影。\n男：我哥哥昨天看了那部太空電影，說有點無聊。\n女：那我們看動物卡通吧！聽起來有趣多了。\n男：太好了。我來訂週六下午的兩張票。\n旁白：問題：他們決定要看哪一部電影？", "options": [{"id": "A", "text": "A ghost movie.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "An exciting space movie.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "A funny animal cartoon.", "imagePath": null, "imageAlt": null}], "correctOptionId": "C", "explanationZhTW": "男孩轉述哥哥說太空電影有點無聊，女孩提議改看動物卡通，男孩贊同並負責訂票，故選 (C)。", "skillTags": ["言談理解・週末電影選擇"], "points": 1, "audioDurationSeconds": 33.4}, {"id": "gept-listening-04-q14", "number": 14, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q14.m4a", "transcript": [{"speaker": "F", "text": "Did you see my pencil case? I can not find it in my bag."}, {"speaker": "M", "text": "What does it look like?"}, {"speaker": "F", "text": "It is a green pencil case with a picture of a white cat on it."}, {"speaker": "M", "text": "Wait, I saw a green pencil case on the teacher's desk after English class."}, {"speaker": "F", "text": "Thank you! I must have left it there when I gave in my homework."}, {"speaker": "N", "text": "Question: Where is the girl's green pencil case?"}], "transcriptZhTW": [{"speaker": "F", "text": "你有看到我的鉛筆盒嗎？我在書包裡找不到。"}, {"speaker": "M", "text": "它長什麼樣子？"}, {"speaker": "F", "text": "是一個綠色的鉛筆盒，上面有一隻白貓的圖案。"}, {"speaker": "M", "text": "等等，英文課後我有看到老師桌上有一個綠色鉛筆盒。"}, {"speaker": "F", "text": "謝謝你！我交作業時一定把它忘在那裡了。"}, {"speaker": "N", "text": "問題：這名女孩的綠色鉛筆盒在哪裡？"}], "translationZhTW": "女：你有看到我的鉛筆盒嗎？我在書包裡找不到。\n男：它長什麼樣子？\n女：是一個綠色的鉛筆盒，上面有一隻白貓的圖案。\n男：等等，英文課後我有看到老師桌上有一個綠色鉛筆盒。\n女：謝謝你！我交作業時一定把它忘在那裡了。\n旁白：問題：這名女孩的綠色鉛筆盒在哪裡？", "options": [{"id": "A", "text": "On the teacher's desk.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "Under the chair.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "Inside her bag.", "imagePath": null, "imageAlt": null}], "correctOptionId": "A", "explanationZhTW": "男孩提到在英文課後看到老師桌上有一個綠色鉛筆盒，女孩確認是交作業時留在那裡的，故選 (A)。", "skillTags": ["言談理解・教室遺失綠色鉛筆盒"], "points": 1, "audioDurationSeconds": 32.1}, {"id": "gept-listening-04-q15", "number": 15, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q15.m4a", "transcript": [{"speaker": "F", "text": "Mother's birthday is coming next Wednesday. What should we do for her?"}, {"speaker": "M", "text": "How about cooking a special dinner at home? Your mother loves beef noodles."}, {"speaker": "F", "text": "Good idea! I can make a fresh vegetable salad, and you can cook the beef noodles."}, {"speaker": "M", "text": "Great. And we can buy a delicious chocolate cake from the bakery."}, {"speaker": "N", "text": "Question: What will the girl make for her mother's birthday?"}], "transcriptZhTW": [{"speaker": "F", "text": "下週三就是媽媽的生日了。我們應該為她做點什麼？"}, {"speaker": "M", "text": "在家煮一頓特別的晚餐如何？妳媽媽很喜歡牛肉麵。"}, {"speaker": "F", "text": "好主意！我可以做新鮮蔬菜沙拉，你負責煮牛肉麵。"}, {"speaker": "M", "text": "太好了。我們還可以去麵包店買一個美味的巧克力蛋糕。"}, {"speaker": "N", "text": "問題：這名女孩在媽媽生日時會做什麼？"}], "translationZhTW": "女：下週三就是媽媽的生日了。我們應該為她做點什麼？\n男：在家煮一頓特別的晚餐如何？妳媽媽很喜歡牛肉麵。\n女：好主意！我可以做新鮮蔬菜沙拉，你負責煮牛肉麵。\n男：太好了。我們還可以去麵包店買一個美味的巧克力蛋糕。\n旁白：問題：這名女孩在媽媽生日時會做什麼？", "options": [{"id": "A", "text": "A chocolate cake.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "A fresh vegetable salad.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "Beef noodles.", "imagePath": null, "imageAlt": null}], "correctOptionId": "B", "explanationZhTW": "女孩主動提出「I can make a fresh vegetable salad」（我可以做新鮮蔬菜沙拉），爸爸煮牛肉麵，故選 (B)。", "skillTags": ["言談理解・母親節晚餐分工"], "points": 1, "audioDurationSeconds": 33.5}, {"id": "gept-listening-04-q16", "number": 16, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q16.m4a", "transcript": [{"speaker": "N", "text": "Attention, please. Train Number One Hundred and Six to Taichung will be late by twenty minutes because of heavy rain on the mountain tracks. The train will now arrive at Platform One at ten forty not ten twenty. Passengers waiting for this train, please stay behind the yellow line on the platform. We are sorry for being late."}, {"speaker": "N", "text": "Question: Why will the train to Taichung be late?"}], "transcriptZhTW": [{"speaker": "N", "text": "各位旅客請注意。開往台中的第 106 次列車，由於山區軌道大雨，將延誤二十分鐘。本列車現在將改於十點四十分抵達第一月台，而非原訂的十點二十分。等候本班車的旅客請站在月台黃線後方。造成不便深感抱歉。"}, {"speaker": "N", "text": "問題：開往台中的火車為何會誤點？"}], "translationZhTW": "旁白：各位旅客請注意。開往台中的第 106 次列車，由於山區軌道大雨，將延誤二十分鐘。本列車現在將改於十點四十分抵達第一月台，而非原訂的十點二十分。等候本班車的旅客請站在月台黃線後方。造成不便深感抱歉。\n旁白：問題：開往台中的火車為何會誤點？", "options": [{"id": "A", "text": "Because of a broken door on the train.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "Because there are too many passengers.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "Because of heavy rain on the mountain tracks.", "imagePath": null, "imageAlt": null}], "correctOptionId": "C", "explanationZhTW": "廣播清楚說明誤點 20 分鐘的原因為「heavy rain on the mountain tracks」（山區鐵道下大雨），故選 (C)。", "skillTags": ["言談理解・火車站山區大雨誤點廣播"], "points": 1, "audioDurationSeconds": 31.1}, {"id": "gept-listening-04-q17", "number": 17, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q17.m4a", "transcript": [{"speaker": "M", "text": "Are you working on our history report?"}, {"speaker": "F", "text": "Yes. I found two great books about ancient castles, but the library rules say we can not take these books home."}, {"speaker": "M", "text": "That is fine. We can take notes here or make copies of the important pages."}, {"speaker": "F", "text": "Good thinking. Let's finish our report before the library closes at five o'clock."}, {"speaker": "N", "text": "Question: What did the boy suggest doing?"}], "transcriptZhTW": [{"speaker": "M", "text": "妳正在做我們的歷史報告嗎？"}, {"speaker": "F", "text": "是的。我找到了兩本關於古老城堡的好書，但圖書館規定我們不能把這些書帶回家。"}, {"speaker": "M", "text": "沒關係。我們可以在這裡做筆記，或者把重要的頁面影印下來。"}, {"speaker": "F", "text": "好想法。我們在圖書館五點閉館前把報告完成吧。"}, {"speaker": "N", "text": "問題：這名男孩建議怎麼做？"}], "translationZhTW": "男：妳正在做我們的歷史報告嗎？\n女：是的。我找到了兩本關於古老城堡的好書，但圖書館規定我們不能把這些書帶回家。\n男：沒關係。我們可以在這裡做筆記，或者把重要的頁面影印下來。\n女：好想法。我們在圖書館五點閉館前把報告完成吧。\n旁白：問題：這名男孩建議怎麼做？", "options": [{"id": "A", "text": "Taking notes or making copies in the library.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "Taking the books home to read.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "Visiting an ancient castle this weekend.", "imagePath": null, "imageAlt": null}], "correctOptionId": "A", "explanationZhTW": "面對書籍不能外借的規定，男孩建議「take notes here or make copies of the important pages」（在館內做筆記或複印重要頁面），故選 (A)。", "skillTags": ["言談理解・圖書館歷史報告查資料"], "points": 1, "audioDurationSeconds": 32.9}, {"id": "gept-listening-04-q18", "number": 18, "sectionId": "dialogue", "type": "image-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q18.m4a", "transcript": [{"speaker": "F", "text": "Excuse me, sir. We want to see the monkeys. Where is Monkey Hill?"}, {"speaker": "M", "text": "Walk straight past the lake from the entrance. Turn right, and Monkey Hill is on the north east corner, just north of the bird garden."}, {"speaker": "F", "text": "Is it across from the elephants?"}, {"speaker": "M", "text": "That is right. The elephants are on the west side, and the monkeys are on the east side."}, {"speaker": "N", "text": "Question: Where is Monkey Hill on the zoo map?"}], "transcriptZhTW": [{"speaker": "F", "text": "不好意思，先生。我們想看猴子。請問猴子山在哪裡？"}, {"speaker": "M", "text": "從入口處直走穿過湖泊，然後右轉，猴子山就在東北角，正好在鳥園的北邊。"}, {"speaker": "F", "text": "它在大象區的對面嗎？"}, {"speaker": "M", "text": "沒錯。大象在西邊，猴子在東邊。"}, {"speaker": "N", "text": "問題：動物園地圖上的哪一個位置是猴子山？"}], "translationZhTW": "女：不好意思，先生。我們想看猴子。請問猴子山在哪裡？\n男：從入口處直走穿過湖泊，然後右轉，猴子山就在東北角，正好在鳥園的北邊。\n女：它在大象區的對面嗎？\n男：沒錯。大象在西邊，猴子在東邊。\n旁白：問題：動物園地圖上的哪一個位置是猴子山？", "options": [{"id": "A", "text": null, "imagePath": "images/zoo-map-elephants-nw.svg", "imageAlt": "Zoo map highlighting Elephants"}, {"id": "B", "text": null, "imagePath": "images/zoo-map-bird-garden-se.svg", "imageAlt": "Zoo map highlighting Bird Garden"}, {"id": "C", "text": null, "imagePath": "images/zoo-map-monkey-hill-ne.svg", "imageAlt": "Zoo map highlighting Monkey Hill"}], "correctOptionId": "C", "explanationZhTW": "依照工作人員指引，穿過中央湖泊後右轉，猴子山（Monkey Hill）位於東北角、大象區的對面、鳥園的北邊，符合圖 (C) 的標示位置；圖 (A) 為大象區，圖 (B) 為鳥園。", "skillTags": ["言談理解・動物園地圖找猴子山"], "points": 1, "audioDurationSeconds": 34.4}, {"id": "gept-listening-04-q19", "number": 19, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q19.m4a", "transcript": [{"speaker": "F", "text": "Good afternoon, students. This is a reminder from the school nurse. Many students spend long hours looking at computer screens. To protect your eyes, please remember the rule: after every twenty minutes of screen time, look at green trees far away for twenty seconds. Also, keep your room bright when reading, and get enough sleep every night. Healthy eyes help you learn better."}, {"speaker": "N", "text": "Question: What should students do every twenty minutes to protect their eyes?"}], "transcriptZhTW": [{"speaker": "F", "text": "各位同學午安。這是學校護理師的提醒。許多學生花很長時間盯著電腦螢幕。為了保護眼睛，請記住這個原則：每看螢幕二十分鐘，就眺望遠處綠樹二十秒。此外，閱讀時房間要保持明亮，每晚要有充足的睡眠。健康的眼睛有助於學得更好。"}, {"speaker": "N", "text": "問題：為了保護眼睛，學生每二十分鐘應該做什麼？"}], "translationZhTW": "女：各位同學午安。這是學校護理師的提醒。許多學生花很長時間盯著電腦螢幕。為了保護眼睛，請記住這個原則：每看螢幕二十分鐘，就眺望遠處綠樹二十秒。此外，閱讀時房間要保持明亮，每晚要有充足的睡眠。健康的眼睛有助於學得更好。\n旁白：問題：為了保護眼睛，學生每二十分鐘應該做什麼？", "options": [{"id": "A", "text": "Wash their faces with cold water.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "Look at green trees far away for twenty seconds.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "Turn off all the room lights.", "imagePath": null, "imageAlt": null}], "correctOptionId": "B", "explanationZhTW": "護理師提醒同學每看螢幕 20 分鐘，應「look at green trees far away for twenty seconds」（眺望遠處綠樹 20 秒），故選 (B)。", "skillTags": ["言談理解・健康中心護理師護眼提醒"], "points": 1, "audioDurationSeconds": 36.0}, {"id": "gept-listening-04-q20", "number": 20, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q20.m4a", "transcript": [{"speaker": "M", "text": "Are you ready for our swimming race this Saturday?"}, {"speaker": "F", "text": "I feel confident, but the city swimming pool will close on Friday for cleaning."}, {"speaker": "M", "text": "Don't worry. We can go to the school pool for our practice on Friday afternoon."}, {"speaker": "F", "text": "That is a great idea. Let's meet at the school pool at three thirty."}, {"speaker": "N", "text": "Question: Where will they practice swimming on Friday afternoon?"}], "transcriptZhTW": [{"speaker": "M", "text": "妳準備好參加這週六的游泳比賽了嗎？"}, {"speaker": "F", "text": "我蠻有信心的，但是市立游泳池週五因為清潔會閉館。"}, {"speaker": "M", "text": "別擔心。我們週五下午可以改去學校泳池練習。"}, {"speaker": "F", "text": "那是個好主意。我們三點半在學校泳池見吧。"}, {"speaker": "N", "text": "問題：他們週五下午會在哪裡練習游泳？"}], "translationZhTW": "男：妳準備好參加這週六的游泳比賽了嗎？\n女：我蠻有信心的，但是市立游泳池週五因為清潔會閉館。\n男：別擔心。我們週五下午可以改去學校泳池練習。\n女：那是個好主意。我們三點半在學校泳池見吧。\n旁白：問題：他們週五下午會在哪裡練習游泳？", "options": [{"id": "A", "text": "At the school pool.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "At the city swimming pool.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "At the beach.", "imagePath": null, "imageAlt": null}], "correctOptionId": "A", "explanationZhTW": "市立泳池週五閉館清潔，兩人商定「go to the school pool for our practice on Friday afternoon」（週五下午改到學校泳池練習），故選 (A)。", "skillTags": ["言談理解・週五改至學校泳池練習"], "points": 1, "audioDurationSeconds": 30.6}, {"id": "gept-listening-04-q21", "number": 21, "sectionId": "dialogue", "type": "single-choice", "instruction": "請聽對話或短文及問題，選出最適合的答案。", "audioPath": "audio/q21.m4a", "transcript": [{"speaker": "M", "text": "My grandmother called from Tainan this morning. She said the weather there is very hot and sunny."}, {"speaker": "F", "text": "Really? In Taichung it has been cloudy and rainy all week."}, {"speaker": "M", "text": "Yes. So when we pack our bags for our trip to Tainan, remember to pack light shirts, glasses, and hats."}, {"speaker": "F", "text": "Good idea. I will also bring a water bottle so we don't get thirsty under the hot sun."}, {"speaker": "N", "text": "Question: What should they pack for their trip to Tainan?"}], "transcriptZhTW": [{"speaker": "M", "text": "我祖母今天早上從台南打電話來，說那裡天氣非常炎熱晴朗。"}, {"speaker": "F", "text": "真的嗎？台中這一整週都是陰天且下雨。"}, {"speaker": "M", "text": "對啊。所以當我們為台南之行打包行李時，記得帶輕便襯衫、眼鏡和帽子。"}, {"speaker": "F", "text": "好主意。我也會帶個水壺，這樣在烈日下就不會口渴了。"}, {"speaker": "N", "text": "問題：他們去台南旅行應該打包什麼？"}], "translationZhTW": "男：我祖母今天早上從台南打電話來，說那裡天氣非常炎熱晴朗。\n女：真的嗎？台中這一整週都是陰天且下雨。\n男：對啊。所以當我們為台南之行打包行李時，記得帶輕便襯衫、眼鏡和帽子。\n女：好主意。我也會帶個水壺，這樣在烈日下就不會口渴了。\n旁白：問題：他們去台南旅行應該打包什麼？", "options": [{"id": "A", "text": "Heavy winter coats and warm gloves.", "imagePath": null, "imageAlt": null}, {"id": "B", "text": "Warm coats and umbrellas.", "imagePath": null, "imageAlt": null}, {"id": "C", "text": "Light shirts, glasses, and hats.", "imagePath": null, "imageAlt": null}], "correctOptionId": "C", "explanationZhTW": "台南天氣炎熱晴朗，男子提醒「pack light shirts, glasses, and hats」（帶輕便襯衫、眼鏡與帽子），故選 (C)。", "skillTags": ["言談理解・台南炎熱晴朗打包建議"], "points": 1, "audioDurationSeconds": 36.7}]}</script>
<script>
'use strict';
const BANK=JSON.parse(document.getElementById('bank-data').textContent),Q=BANK.questions,$=s=>document.querySelector(s),KEY='listening-lab-gept-elem-04-v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function audioSource(path){return path+'?v='+encodeURIComponent(BANK.audio.revision||'original-v1');}
const audio=$('#player');let state=null,screen='question',filter='all',speed=1,running=false,runToken=0,waitId=null,autoId=null,toastId=null,saveOK=true;
function blank(mode){return{version:1,bankId:BANK.bankId,mode,index:0,answers:Array(Q.length).fill(null),plays:Array(Q.length).fill(0),flags:[],checked:[],started:Date.now(),deadline:mode==='exam'?Date.now()+1500000:null,finished:false,finishedAt:null};}
try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.version===1&&x.bankId===BANK.bankId&&['practice','exam'].includes(x.mode)&&Array.isArray(x.answers)&&x.answers.length===Q.length&&x.answers.every(a=>a===null||'ABC'.includes(a))&&Array.isArray(x.plays)&&x.plays.length===Q.length&&x.plays.every(p=>Number.isInteger(p)&&p>=0)&&Number.isInteger(x.index)&&x.index>=0&&x.index<Q.length&&Array.isArray(x.flags)&&Array.isArray(x.checked)&&(!x.deadline||Number.isFinite(x.deadline)))state=x;}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));saveOK=true;}catch{saveOK=false;}}
function toast(t){clearTimeout(toastId);$('#toast').textContent=t;$('#toast').hidden=false;toastId=setTimeout(()=>$('#toast').hidden=true,4500);}
function ask(title,body,callback,label='確定'){const d=$('#modal');$('#modalTitle').textContent=title;$('#modalBody').textContent=body;$('#modalConfirm').textContent=label;$('#modalConfirm').onclick=()=>{d.close();callback();};$('#modalCancel').onclick=()=>d.close();d.showModal();}
function stop(){runToken++;clearTimeout(waitId);clearTimeout(autoId);audio.pause();audio.onended=null;audio.onerror=null;running=false;updatePlayback();}
function begin(mode){const act=()=>{stop();state=blank(mode);speed=1;save();screen='question';render();window.scrollTo(0,0);};if(state&&!state.finished)ask('開始新的練習？','目前未交卷的作答紀錄將被新的練習取代。',act,'開始新練習');else act();}
function answered(){return state.answers.filter(Boolean).length;}
function correct(i){return state.answers[i]===Q[i].correctOptionId;}
function render(){if(screen==='question')renderQuestion();else renderResults();updateClock();}
function navSection(s){return `<div class="side-title">${esc(s.name)} <span style="float:right">${s.start}–${s.end}</span></div><div class="nav-grid">${Q.filter(q=>q.sectionId===s.id).map(q=>{const i=q.number-1;return `<button class="nav-q ${state.answers[i]?'answered':''} ${state.index===i?'current':''} ${state.flags.includes(i)?'flagged':''}" aria-label="第 ${q.number} 題${state.answers[i]?'，已作答':''}${state.flags.includes(i)?'，待複習':''}" ${state.index===i?'aria-current="step"':''} onclick="go(${i})">${q.number}</button>`;}).join('')}</div>`;}
function renderQuestion(){const i=state.index,q=Q[i],section=BANK.sections.find(s=>s.id===q.sectionId),image=q.type==='image-choice';$('#app').innerHTML=`<div class="wrap"><div class="topline"><div><div class="eyebrow">GEPT ELEMENTARY PRACTICE 04</div><h2 style="margin:5px 0 0">${state.mode==='exam'?'模擬測驗':'自主練習'}</h2></div><div class="actions"><span class="timer" id="clock"></span><button class="btn secondary" onclick="confirmSubmit()">交卷計分</button></div></div><div class="workspace"><aside class="sidebar"><span class="eyebrow">YOUR ANSWER SHEET</span>${BANK.sections.map(navSection).join('')}<div class="legend"><span><i class="dot"></i>已作答</span><span><i class="dot orange"></i>待複習</span></div><p class="side-note">${state.mode==='exam'?'點播放後每題連播兩次，播畢 8 秒後自動前進。換題會停止目前語音。':'先抓住關鍵字，再試著理解完整語意。選好答案後，可以對答案或繼續下一題。'}</p></aside><main><div class="status-line"><span>已作答 <b>${answered()}</b> / 21 題</span><div class="overall-track"><span style="width:${answered()/21*100}%"></span></div><span>${esc(section.name)}</span></div><article class="question-panel"><div class="q-head"><span class="q-number">QUESTION ${String(q.number).padStart(2,'0')} <span style="color:#b0bbb3">/ 21</span></span><button class="flag-btn ${state.flags.includes(i)?'on':''}" aria-pressed="${state.flags.includes(i)}" onclick="flag()">⚑ ${state.flags.includes(i)?'已標記':'稍後複習'}</button></div><h3 class="instruction">${esc(q.instruction)}</h3><div class="audio-panel"><div class="audio-row"><button class="play" id="playBtn" onclick="togglePlay()" aria-label="播放本題兩次">▶</button><div class="audio-info"><div class="audio-title" id="audioStatus" role="status" aria-live="polite">準備好就按下播放</div><div class="audio-detail">M4A / AAC · 美式英語 · ${q.number<=11?'聆聽句子':'聆聽內容與問題'} · 每輪播放兩次</div></div><div class="wave" id="wave" aria-hidden="true">${[12,21,14,25,17,10,22,15,25,11,19,14].map(h=>`<i style="height:${h}px"></i>`).join('')}</div></div><div class="progress-track"><div class="progress-fill" id="audioProgress"></div></div><div class="audio-bottom"><span id="playCount"></span>${state.mode==='practice'?`<label>速度 <select id="speed" onchange="setSpeed(this.value)">${[.75,.85,1,1.15,1.25].map(n=>`<option value="${n}" ${n===speed?'selected':''}>${n}×</option>`).join('')}</select></label>`:'<span>固定 1× 語速</span>'}<span id="audioTime">00:00</span></div></div><div class="options ${image?'image-options':''} ${q.number===18?'map-options':''}" role="group" aria-label="第 ${q.number} 題選項">${q.options.map(o=>optionMarkup(q,i,o,image)).join('')}</div>${state.mode==='practice'&&state.checked.includes(i)?feedback(i):''}<div class="q-bottom"><button class="btn secondary" ${i===0?'disabled':''} onclick="go(${i-1})">← 上一題</button>${state.mode==='practice'?'<button class="btn quiet" onclick="check()">對答案</button>':'<span class="hint">交卷後可查看逐字稿與解析</span>'}<button class="btn" onclick="${i===20?'confirmSubmit()':`go(${i+1})`}">${i===20?'交卷計分':'下一題 →'}</button></div></article><div class="save-note">${saveOK?'● 作答紀錄自動保存在此瀏覽器':'此瀏覽器無法儲存進度，請在關閉前完成作答。'}</div></main></div></div>`;updatePlayback();}
function imageSource(path){return path+'?v='+encodeURIComponent(BANK.illustrations?.revision||'original');}
function optionMarkup(q,i,o,image){
 const choice=`<button class="option ${state.answers[i]===o.id?'selected':''}" aria-pressed="${state.answers[i]===o.id}" onclick="answer('${o.id}')"><span class="letter">${o.id}</span>${image?`<img src="${esc(imageSource(o.imagePath))}" alt="${esc(o.imageAlt)}" width="600" height="440">`:`<span lang="en">${esc(o.text)}</span>`}</button>`;
 return image?`<div class="image-choice">${choice}<button class="image-zoom" onclick="openImage(${i},'${o.id}')" aria-label="放大第 ${q.number} 題選項 ${o.id}">放大圖片 ↗</button></div>`:choice;
}
let zoomQuestion=0,zoomOption='A';
function openImage(i,id){
 const q=Q[i],o=q.options.find(o=>o.id===id);if(!o?.imagePath)return;
 zoomQuestion=i;zoomOption=id;$('#imageViewerTitle').textContent=`第 ${q.number} 題・選項 ${id}`;
 $('#imageViewerImg').src=imageSource(o.imagePath);$('#imageViewerImg').alt=o.imageAlt;
 $('#imageViewerTabs').innerHTML=q.options.map(x=>`<button class="filter ${x.id===id?'on':''}" aria-pressed="${x.id===id}" onclick="openImage(${i},'${x.id}')">圖片 ${x.id}</button>`).join('');
 if(!$('#imageViewer').open)$('#imageViewer').showModal();
}

function answer(id){state.answers[state.index]=id;save();const y=window.scrollY;render();window.scrollTo(0,y);}
function flag(){const i=state.index;state.flags=state.flags.includes(i)?state.flags.filter(x=>x!==i):[...state.flags,i];save();render();}
function go(i){if(i<0||i>=Q.length)return;if($('#imageViewer').open)$('#imageViewer').close();stop();state.index=i;save();render();window.scrollTo({top:0,behavior:'auto'});}
function setSpeed(v){speed=Number(v);audio.playbackRate=speed;}
function check(){if(!state.answers[state.index]){toast('請先選擇一個答案。');return;}if(!state.checked.includes(state.index))state.checked.push(state.index);save();render();}
function bilingualTranscript(q){const en={N:'Narrator',M:'Male',F:'Female'},zh={N:'旁白',M:'男聲',F:'女聲'};return `<div class="bilingual-transcript">${q.transcript.map((line,i)=>`<div class="transcript-pair"><p class="transcript-en" lang="en"><b>${en[line.speaker]}:</b> ${esc(line.text)}</p><p class="transcript-zh" lang="zh-TW"><b>${zh[q.transcriptZhTW[i].speaker]}：</b> ${esc(q.transcriptZhTW[i].text)}</p></div>`).join('')}</div>`;}
function feedback(i){const q=Q[i];return `<div class="feedback ${correct(i)?'':'bad'}"><h3>${correct(i)?'✓ 答對了':'再聽一次，留意關鍵線索'} · 正解 ${q.correctOptionId}</h3><p>${esc(q.explanationZhTW)}</p><details><summary>查看英文逐字稿與逐句中文翻譯</summary>${bilingualTranscript(q)}</details></div>`;}
function togglePlay(){if(running){stop();toast('已停止播放。');return;}playQuestion();}
function updatePlayback(text){if(!state||screen!=='question')return;const n=state.plays[state.index],exam=state.mode==='exam',b=$('#playBtn');if(!b)return;b.textContent=running?'■':'▶';b.disabled=!running&&exam&&n>=2;b.setAttribute('aria-label',running?'停止播放與自動換題':exam&&n>=2?'本題已達播放上限':'播放本題');$('#wave').classList.toggle('active',running&&!audio.paused);$('#playCount').textContent=exam?`已用 ${n} / 2 次`:'可不限次重聽 · 每輪兩次';$('#audioStatus').textContent=text||(running?'正在聆聽…':exam&&n>=2?'已達本題播放上限':'準備好就按下播放');}
function playQuestion(){if(!state||state.finished||screen!=='question')return;const i=state.index,exam=state.mode==='exam';if(exam&&state.plays[i]>=2)return;stop();running=true;const token=runToken;let remaining=exam?2-state.plays[i]:2;audio.src=audioSource(Q[i].audioPath);audio.playbackRate=exam?1:speed;const fail=()=>{if(token!==runToken)return;stop();toast('音檔無法播放，請檢查網路連線，並在瀏覽器允許播放聲音後再試。');};const once=()=>{if(token!==runToken)return;audio.currentTime=0;audio.onended=()=>{if(token!==runToken)return;remaining--;if(remaining>0){updatePlayback('稍候 2 秒，再聽一次…');waitId=setTimeout(once,2000);}else{updatePlayback(exam?'本題播畢，8 秒後前往下一題…':'本輪已播放兩次');if(exam&&i<Q.length-1){autoId=setTimeout(()=>{if(token!==runToken)return;go(i+1);playQuestion();},8000);}else{running=false;updatePlayback(exam?'全卷播畢，可檢查答案後交卷':'本輪已播放兩次，可再重聽');}}};audio.onerror=fail;audio.play().then(()=>{if(token!==runToken)return;state.plays[i]++;save();updatePlayback(`正在播放 · 本輪第 ${exam?state.plays[i]:3-remaining} / 2 次`);}).catch(fail);};once();updatePlayback();}
audio.ontimeupdate=()=>{if(screen!=='question'||!$('#audioProgress'))return;$('#audioProgress').style.width=(Number.isFinite(audio.duration)?audio.currentTime/audio.duration*100:0)+'%';$('#audioTime').textContent=time(audio.currentTime);};
function time(s){s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function updateClock(){if(!state||state.finished)return;if(state.deadline&&Date.now()>=state.deadline){submit(true);return;}if(!$('#clock'))return;const sec=state.deadline?(state.deadline-Date.now())/1000:(Date.now()-state.started)/1000;$('#clock').textContent=(state.deadline?'剩餘 ':'已用 ')+time(sec);$('#clock').classList.toggle('urgent',!!state.deadline&&sec<180);}
setInterval(updateClock,1000);
function confirmSubmit(){stop();const missing=21-answered();ask('交卷並查看成績？',missing?`還有 ${missing} 題未作答，未作答題目將以 0 分計算。交卷後可查看所有解析。`:'21 題都已完成，交卷後可查看成績、逐字稿與解析。',()=>submit(false),'交卷計分');}
function submit(timeout){if($('#imageViewer').open)$('#imageViewer').close();stop();if(!state||state.finished)return;state.finished=true;state.finishedAt=state.deadline&&timeout?state.deadline:Date.now();save();screen='results';filter='all';render();window.scrollTo(0,0);if(timeout)toast('25 分鐘已到，已自動交卷。');}
function reviewOptions(q){if(q.type==='image-choice')return `<div class="review-images">${q.options.map(o=>`<figure><img src="${esc(imageSource(o.imagePath))}" alt="${esc(o.imageAlt)}"><figcaption>${o.id}${o.id===q.correctOptionId?' ✓':''}</figcaption></figure>`).join('')}</div>`;return `<div class="review-options" lang="en">${q.options.map(o=>`<div class="${o.id===q.correctOptionId?'correct':''}">${o.id}. ${esc(o.text)} ${o.id===q.correctOptionId?'✓':''}</div>`).join('')}</div>`;}
function renderResults(){const score=Q.filter((q,i)=>correct(i)).length,wrong=21-score,seconds=((state.finishedAt||Date.now())-state.started)/1000;$('#app').innerHTML=`<div class="wrap"><div class="topline"><div><div class="eyebrow">YOUR LISTENING REPORT</div><h2 style="margin:5px 0 0">每一次練習，都有收穫。</h2></div><span class="screen-label">${state.mode==='exam'?'模擬測驗':'自主練習'} · 用時 ${time(seconds)}</span></div><section class="score-hero"><div class="score-ring"><strong>${score}</strong><small>/ 21 分</small></div><div><div class="eyebrow" style="color:#b5cfbf">ACCURACY ${Math.round(score/21*100)}%</div><h2>${score>=18?'聽得仔細，繼續保持。':score>=12?'掌握線索，再往前一步。':'重聽關鍵句，慢慢建立把握。'}</h2><p>答對 ${score} 題 · 答錯 ${answered()-score} 題 · 未作答 ${21-answered()} 題<br>此為練習原始分數，不換算官方會考等級。</p></div></section><div class="result-stats">${BANK.sections.map(s=>{const indexes=Q.map((q,i)=>q.sectionId===s.id?i:-1).filter(i=>i>=0);return `<div class="stat">${s.name}<strong>${indexes.filter(correct).length} <span class="screen-label">/ ${indexes.length} 題</span></strong></div>`;}).join('')}</div><div class="actions" style="margin-bottom:32px"><button class="btn" onclick="retryWrong()" ${!wrong?'disabled':''}>練習錯題與未答題 (${wrong})</button><button class="btn secondary" onclick="restart()">重新測驗</button><button class="btn secondary" onclick="exportResults()">匯出作答 JSON</button><button class="btn quiet" onclick="printReport()">列印解析</button></div><div class="topline"><h2 style="font-size:21px;margin:0">逐題回顧</h2><div class="actions"><button class="filter ${filter==='all'?'on':''}" onclick="setFilter('all')">全部 21 題</button><button class="filter ${filter==='wrong'?'on':''}" onclick="setFilter('wrong')">錯題與未答 ${wrong}</button></div></div><div>${Q.map((q,i)=>{if(filter==='wrong'&&correct(i))return '';return `<article class="review-card"><h3><span>第 ${q.number} 題 <span class="screen-label">· ${esc(q.skillTags.join('、'))}</span></span><span class="review-status ${correct(i)?'':'bad'}">${correct(i)?'✓ 答對':state.answers[i]?'✕ 答錯':'— 未作答'}</span></h3><p class="answerline">你的答案：${state.answers[i]||'未作答'}　正確答案：${q.correctOptionId}</p>${reviewOptions(q)}<p style="font-size:14px;margin-bottom:12px">${esc(q.explanationZhTW)}</p><button class="btn secondary" style="padding:6px 12px;font-size:12px" onclick="reviewListen(${i})">▶ 重聽本題</button><details><summary style="font-size:13px">英文逐字稿與逐句中文翻譯</summary>${bilingualTranscript(q)}</details></article>`;}).join('')||'<div class="empty">全部答對了，沒有錯題！</div>'}</div><p class="notice">重聽時，先找出自己漏聽的字，再用逐字稿確認。語音、圖片與選項均為原創練習素材。</p></div>`;}
function setFilter(v){stop();filter=v;renderResults();}
function reviewListen(i){stop();audio.src=audioSource(Q[i].audioPath);audio.playbackRate=speed;audio.play().catch(()=>toast('音檔無法播放，請檢查網路連線後再試。'));}
function restart(){ask('重新作答整份試卷？','目前顯示的成績將由新紀錄取代。可以先匯出作答 JSON 保存這次結果。',()=>{state=null;begin('exam');},'重新測驗');}
function retryWrong(){const ids=Q.map((q,i)=>correct(i)?-1:i).filter(i=>i>=0);if(!ids.length)return;ask('開始訂正錯題？','將進入自主練習模式，保留答對題的答案，清空錯題與未答題；可先匯出目前成績。',()=>{stop();state=blank('practice');Q.forEach((q,i)=>{if(!ids.includes(i))state.answers[i]=q.correctOptionId;});state.index=ids[0];state.flags=ids;save();screen='question';render();window.scrollTo(0,0);},'開始訂正');}
function exportResults(){const data={schemaVersion:'1.0.0',bankId:BANK.bankId,audioRevision:BANK.audio.revision||'original-v1',mode:state.mode,startedAt:new Date(state.started).toISOString(),submittedAt:new Date(state.finishedAt).toISOString(),score:Q.filter((q,i)=>correct(i)).length,maxScore:21,answers:Q.map((q,i)=>({questionId:q.id,selectedOptionId:state.answers[i],correctOptionId:q.correctOptionId,isCorrect:correct(i),playCount:state.plays[i]}))};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='listening-results-'+new Date(state.finishedAt).toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function printReport(){stop();filter='all';renderResults();document.querySelectorAll('.review-card details').forEach(d=>d.open=true);window.print();}
$('#imageViewer').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();openImage(zoomQuestion,'ABC'[('ABC'.indexOf(zoomOption)+(e.key==='ArrowRight'?1:2))%3]);}});
// Resume an unfinished exam; otherwise start a new exam immediately.
if(!state||state.mode!=='exam'||state.finished)state=blank('exam');
save();
if(state.deadline&&Date.now()>=state.deadline)submit(true);else render();
</script>
<script>
// Isolated Blogger embed support; no answers or other student data are sent to the parent page.
(function(){
  if(window.parent===window||new URLSearchParams(location.search).get('embed')!=='blogger')return;
  const bankId='cap-listening-gept-elem-04';
  let parentOrigin='*',queued=false,lastHeight=0,lastPosition=screen+':'+state.index;
  function send(type,extra){window.parent.postMessage(Object.assign({type,bankId},extra||{}),parentOrigin);}
  function measure(force){
    const height=Math.ceil(document.body.getBoundingClientRect().height)+2;
    if(force||height!==lastHeight){lastHeight=height;send('listening-exam:height',{height});}
  }
  function schedule(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;measure(false);});}
  const originalOpenImage=openImage;
  openImage=function(){originalOpenImage.apply(this,arguments);send('listening-exam:navigate');};
  const originalAsk=ask;
  ask=function(){originalAsk.apply(this,arguments);send('listening-exam:navigate');};
  const originalRender=render;
  render=function(){
    originalRender();
    const position=screen+':'+state.index;
    if(position!==lastPosition){lastPosition=position;send('listening-exam:navigate');}
    schedule();
  };
  addEventListener('message',event=>{
    if(event.source!==window.parent||!event.data||event.data.type!=='listening-exam:measure'||event.data.bankId!==bankId)return;
    if(event.origin!=='null')parentOrigin=event.origin;
    measure(true);
  });
  if(window.ResizeObserver)new ResizeObserver(schedule).observe(document.body);
  else new MutationObserver(schedule).observe(document.getElementById('app'),{childList:true,subtree:true});
  addEventListener('resize',schedule);
  document.addEventListener('load',schedule,true);
  measure(true);
})();
</script>
<style id="blogger-narrow-layout">
.blogger-embed header,.blogger-embed footer{display:none}
@media(max-width:650px){.nav-grid{grid-template-columns:repeat(8,minmax(0,1fr))}.nav-q{min-width:0;padding:0}.audio-bottom{flex-wrap:wrap;row-gap:6px}}
@media(max-width:420px){header{height:auto;min-height:68px;padding-top:14px;padding-bottom:14px;gap:10px;flex-wrap:wrap}.topline{flex-wrap:wrap;gap:14px}.topline>.actions{margin-left:auto}}
</style>
<script>
if(window.parent!==window&&new URLSearchParams(location.search).get('embed')==='blogger')document.documentElement.classList.add('blogger-embed');
</script>
